<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro — Turismo Isabel</title>

    <!-- 1. Motor de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- PWA Config -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#071020">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      /* --- RECUPERAMOS TODO TU CSS ORIGINAL --- */
      :root {
        --navy: #071020; --sky: #3a8fd1; --sky-bright: #55b3f5; --sky-glow: rgba(55,170,245,0.16);
        --gold: #c8a85a; --green: #2cb87a; --green-bg: rgba(44,184,122,0.12);
        --red: #e04444; --red-bg: rgba(224,68,68,0.12); --amber: #d9a63e;
        --text-0: #ffffff; --text-1: rgba(255,255,255,0.85); --text-2: rgba(180,210,240,0.65);
        --text-3: rgba(140,175,215,0.45); --border: rgba(255,255,255,0.08);
        --border-hi: rgba(255,255,255,0.14); --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
        --r-xl: 22px; --r-2xl: 28px; --font-num: 'Inter', sans-serif;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'DM Sans', sans-serif; background: var(--navy); color: var(--text-1); min-height: 100vh; overflow-x: hidden; position: relative; }
      body::before { content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse 900px 600px at 60% -10%, #0e2555 0%, transparent 60%), radial-gradient(ellipse 600px 500px at 0% 100%, #0a1e44 0%, transparent 55%), var(--navy); }
      
      #app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 22px 16px 100px; display: none; }
      
      /* Login Screen Style */
      #login-screen { position: relative; z-index: 2; max-width: 400px; margin: 80px auto; padding: 20px; text-align: center; }
      
      header.topbar { text-align: center; margin-bottom: 20px; }
      .brand-orb { width: 64px; height: 64px; margin: 0 auto 10px; position: relative; display: flex; align-items: center; justify-content: center; }
      .brand-orb img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; z-index: 1; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
      .brand-title { font-family: 'Cormorant Garamond', serif; font-size: 25px; color: var(--text-0); font-style: italic; }
      .brand-sub { font-family: 'Syne', sans-serif; font-size: 9px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-3); margin-top: 4px; }

      .vista { display: none; }
      .vista.activa { display: block; animation: revealUp 0.35s ease; }
      @keyframes revealUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

      .card { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: var(--r-2xl); padding: 22px 20px; backdrop-filter: blur(20px); margin-bottom: 15px; }
      .saldo-valor { font-family: var(--font-num); font-size: 34px; font-weight: 800; color: var(--text-0); }
      .btn-accion { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 15px; border-radius: var(--r-xl); border: none; cursor: pointer; font-family: 'Syne'; font-weight: 700; text-transform: uppercase; font-size: 13px; }
      .btn-ingreso { background: linear-gradient(135deg, rgba(44,184,122,0.26), rgba(44,184,122,0.14)); border: 1.5px solid rgba(44,184,122,0.32); color: #5de09a; }
      .btn-egreso { background: linear-gradient(135deg, rgba(224,68,68,0.22), rgba(224,68,68,0.10)); border: 1.5px solid rgba(224,68,68,0.30); color: #ff9090; }

      /* Bottom Nav */
      .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: flex; max-width: 480px; margin: 0 auto; background: rgba(10,20,38,0.72); backdrop-filter: blur(18px); border-top: 1px solid var(--border); }
      .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; background: none; border: none; color: var(--text-3); cursor: pointer; }
      .nav-item.activo { color: var(--sky-bright); border-top: 2px solid var(--sky-bright); }
      .nav-item span { font-size: 9px; font-family: 'Syne'; text-transform: uppercase; }

      /* Modales */
      .modal-overlay { position: fixed; inset: 0; z-index: 100; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
      .modal-sheet { width: 100%; max-width: 480px; background: #0d1e38; border-top-left-radius: var(--r-2xl); border-top-right-radius: var(--r-2xl); padding: 25px; border-top: 1px solid var(--border-hi); }
      .lf-input, .lf-select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: white; font-size: 16px; }

      .lista { display: flex; flex-direction: column; gap: 10px; }
      .item-fila { display: flex; align-items: center; gap: 12px; padding: 15px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 16px; }
      .mov-dot { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
      .mov-dot.ing { background: var(--green-bg); color: #5de09a; }
      .mov-dot.egr { background: var(--red-bg); color: #ff9090; }
    </style>
</head>
<body>

<!-- 1. PANTALLA LOGIN (PRIVADA) -->
<div id="login-screen">
    <div class="brand-orb"><img src="icons/icon-512.png" alt="Logo"></div>
    <h1 class="brand-title">Turismo Isabel</h1>
    <p class="brand-sub">Acceso Privado</p>
    <div class="card" style="margin-top: 30px;">
        <input type="email" id="email" class="lf-input" placeholder="Email Empresa">
        <input type="password" id="password" class="lf-input" placeholder="Contraseña">
        <button onclick="handleLogin()" class="btn-accion btn-ingreso" style="width: 100%; margin-top: 10px;">Entrar al Sistema</button>
        <p id="login-error" style="color: #ff9090; font-size: 12px; margin-top: 10px; display: none;"></p>
    </div>
</div>

<!-- 2. APP PRINCIPAL (DISEÑO ORIGINAL) -->
<div id="app">
  <header class="topbar">
    <div class="brand-orb"><img src="icons/icon-512.png" alt="Logo"></div>
    <div class="brand-title">Registro</div>
    <div class="brand-sub">Ingresos y Egresos</div>
    <button onclick="logout()" style="background:none; border:none; color:gray; font-size:10px; cursor:pointer;">CERRAR SESIÓN</button>
  </header>

  <!-- VISTA: INICIO -->
  <section class="vista activa" id="vista-inicio">
    <div class="card">
      <div class="saldo-label" style="font-size:10px; color:gray;">SALDO TOTAL ARS</div>
      <div class="saldo-valor" id="saldoValor">$ 0</div>
      <div style="display:flex; gap:10px; margin-top:15px;">
          <div style="flex:1; color:#5de09a; font-size:12px;">Ingresos: <span id="resumen-ing">$ 0</span></div>
          <div style="flex:1; color:#ff9090; font-size:12px;">Egresos: <span id="resumen-egr">$ 0</span></div>
      </div>
    </div>

    <div class="acciones" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:20px;">
      <button class="btn-accion btn-ingreso" onclick="abrirModalMov('ingreso')">Ingreso</button>
      <button class="btn-accion btn-egreso" onclick="abrirModalMov('egreso')">Egreso</button>
    </div>

    <div class="lista" id="movLista"></div>
  </section>

  <!-- VISTA: CUENTAS -->
  <section class="vista" id="vista-cuentas">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
        <h3 class="brand-sub">Mis Cuentas</h3>
        <button class="btn-accion btn-ingreso" style="padding:5px 15px;" onclick="abrirModalCuenta()">+ Nueva</button>
    </div>
    <div class="lista" id="cuentasLista"></div>
  </section>

  <!-- VISTA: CATEGORIAS -->
  <section class="vista" id="vista-categorias">
    <h3 class="brand-sub" style="margin-bottom:15px;">Categorías</h3>
    <div class="lista" id="categoriasLista"></div>
  </section>
</div>

<!-- NAV INFERIOR -->
<nav class="bottom-nav">
  <button class="nav-item activo" onclick="cambiarVista('inicio', this)"><span>Inicio</span></button>
  <button class="nav-item" onclick="cambiarVista('cuentas', this)"><span>Cuentas</span></button>
  <button class="nav-item" onclick="cambiarVista('categorias', this)"><span>Categorías</span></button>
</nav>

<!-- MODAL MOVIMIENTO -->
<div class="modal-overlay" id="modalMov">
    <div class="modal-sheet">
        <h2 id="modalMovTitulo" style="font-family:'Syne'; margin-bottom:15px;">Nuevo</h2>
        <input type="text" id="inpConcepto" class="lf-input" placeholder="Concepto">
        <input type="number" id="inpMonto" class="lf-input" placeholder="Monto $">
        <select id="inpCuenta" class="lf-select"></select>
        <select id="inpCategoria" class="lf-select"></select>
        <button onclick="guardarMovimiento()" class="btn-accion btn-ingreso" style="width:100%; margin-top:15px;">Guardar</button>
        <button onclick="cerrarModal('modalMov')" style="width:100%; background:none; border:none; color:gray; margin-top:10px;">Cancelar</button>
    </div>
</div>

<script>
/* --- CONFIGURACIÓN SUPABASE --- */
const SUPABASE_URL = 'https://lnbioecdbxkhjwmezwgv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_W9BRolWbAnNqP2giJQMvOQ_LsFV8fmd';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user = null;
let movs = [], cuentas = [], categorias = [];
let tipoActual = 'ingreso';

/* --- AUTENTICACIÓN --- */
async function checkUser() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (session) {
        user = session.user;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        init();
    } else {
        document.getElementById('login-screen').style.display = 'block';
        document.getElementById('app').style.display = 'none';
    }
}

async function handleLogin() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { error } = await _supabase.auth.signInWithPassword({ email, password });
    if (error) {
        const err = document.getElementById('login-error');
        err.innerText = "Error: Usuario o clave incorrectos";
        err.style.display = 'block';
    } else {
        checkUser();
    }
}

async function logout() { await _supabase.auth.signOut(); window.location.reload(); }

/* --- NAVEGACIÓN --- */
function cambiarVista(vistaId, btn) {
    document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa'));
    document.getElementById('vista-' + vistaId).classList.add('activa');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('activo'));
    btn.classList.add('activo');
}

/* --- DATOS --- */
async function init() {
    const [resM, resC, resCat] = await Promise.all([
        _supabase.from('movimientos').select('*').order('fecha', { ascending: false }),
        _supabase.from('cuentas').select('*'),
        _supabase.from('categorias').select('*')
    ]);
    movs = resM.data || [];
    cuentas = resC.data || [];
    categorias = resCat.data || [];
    renderTodo();
}

function renderTodo() {
    renderInicio();
    renderCuentas();
    renderCategorias();
    
    // Poblar selects del modal
    document.getElementById('inpCuenta').innerHTML = cuentas.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
    document.getElementById('inpCategoria').innerHTML = categorias.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
}

function renderInicio() {
    let balance = 0, ing = 0, egr = 0;
    const lista = document.getElementById('movLista');
    lista.innerHTML = movs.map(m => {
        const esIng = m.tipo === 'ingreso';
        balance += esIng ? m.monto_ars : -m.monto_ars;
        esIng ? ing += m.monto_ars : egr += m.monto_ars;
        return `
            <div class="item-fila">
                <div class="mov-dot ${esIng ? 'ing' : 'egr'}">S</div>
                <div style="flex:1">
                    <div style="font-weight:600; color:white;">${m.concepto}</div>
                    <div style="font-size:10px; color:gray;">${new Date(m.fecha).toLocaleDateString()}</div>
                </div>
                <div style="font-family:var(--font-num); font-weight:700; color:${esIng ? '#5de09a' : '#ff9090'}">
                    ${esIng ? '+' : '-'} $${m.monto_ars.toLocaleString()}
                </div>
            </div>`;
    }).join('');
    
    document.getElementById('saldoValor').innerText = `$ ${balance.toLocaleString()}`;
    document.getElementById('resumen-ing').innerText = `$ ${ing.toLocaleString()}`;
    document.getElementById('resumen-egr').innerText = `$ ${egr.toLocaleString()}`;
}

function renderCuentas() {
    document.getElementById('cuentasLista').innerHTML = cuentas.map(c => `
        <div class="card">
            <div style="color:var(--sky); font-weight:bold;">${c.nombre}</div>
            <div style="font-size:10px; color:gray;">${c.moneda}</div>
        </div>`).join('');
}

function renderCategorias() {
    document.getElementById('categoriasLista').innerHTML = categorias.map(c => `
        <div class="item-fila">${c.nombre}</div>`).join('');
}

/* --- MODALES Y GUARDADO --- */
function abrirModalMov(tipo) {
    tipoActual = tipo;
    document.getElementById('modalMovTitulo').innerText = tipo === 'ingreso' ? 'Registrar Ingreso' : 'Registrar Egreso';
    document.getElementById('modalMov').style.display = 'flex';
}

function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }

async function guardarMovimiento() {
    const concepto = document.getElementById('inpConcepto').value;
    const monto = parseFloat(document.getElementById('inpMonto').value);
    const cuentaId = document.getElementById('inpCuenta').value;
    const catId = document.getElementById('inpCategoria').value;

    if(!concepto || !monto) return alert("Completa los datos");

    const { error } = await _supabase.from('movimientos').insert([{
        user_id: user.id,
        tipo: tipoActual,
        concepto,
        monto: monto,
        monto_ars: monto,
        cuenta_id: cuentaId,
        categoria_id: catId,
        fecha: new Date().toISOString()
    }]);

    if(error) alert(error.message);
    else { cerrarModal('modalMov'); init(); }
}

// Inicialización
checkUser();
</script>
</body>
</html>
