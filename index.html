<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Registro TI — Sistema Privado</title>

<!-- SDK Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- PWA Tags -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#071020">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --navy: #071020; --sky: #3a8fd1; --sky-bright: #55b3f5; --sky-glow: rgba(55,170,245,0.16);
    --gold: #c8a85a; --green: #2cb87a; --green-bg: rgba(44,184,122,0.12);
    --red: #e04444; --red-bg: rgba(224,68,68,0.12); --amber: #d9a63e;
    --text-0: #ffffff; --text-1: rgba(255,255,255,0.85); --text-2: rgba(180,210,240,0.65);
    --text-3: rgba(140,175,215,0.45); --border: rgba(255,255,255,0.08);
    --border-hi: rgba(255,255,255,0.14); --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
    --r-xl: 22px; --r-2xl: 28px; --font-num: 'Inter', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--navy); color: var(--text-1); min-height: 100vh; overflow-x: hidden; position: relative; }
  body::before { content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse 900px 600px at 60% -10%, #0e2555 0%, transparent 60%), radial-gradient(ellipse 600px 500px at 0% 100%, #0a1e44 0%, transparent 55%), var(--navy); }
  
  #app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 22px 16px 100px; display: none; }
  #login-screen { position: relative; z-index: 2; max-width: 400px; margin: 80px auto; padding: 20px; text-align: center; }

  /* UI Components */
  .vista { display: none; }
  .vista.activa { display: block; animation: revealUp 0.35s ease-out; }
  @keyframes revealUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  .card { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: var(--r-2xl); padding: 22px 20px; backdrop-filter: blur(20px); margin-bottom: 15px; isolation: isolate; }
  .saldo-valor { font-family: var(--font-num); font-size: 34px; font-weight: 800; color: var(--text-0); }
  .btn-accion { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 15px 12px; border-radius: var(--r-xl); border: none; cursor: pointer; font-family: 'Syne'; font-weight: 700; text-transform: uppercase; font-size: 13px; }
  .btn-ingreso { background: linear-gradient(135deg, rgba(44,184,122,0.26), rgba(44,184,122,0.14)); border: 1.5px solid rgba(44,184,122,0.32); color: #5de09a; }
  .btn-egreso { background: linear-gradient(135deg, rgba(224,68,68,0.22), rgba(224,68,68,0.10)); border: 1.5px solid rgba(224,68,68,0.30); color: #ff9090; }

  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: flex; max-width: 480px; margin: 0 auto; background: rgba(10,20,38,0.72); backdrop-filter: blur(18px); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 11px 0; background: none; border: none; color: var(--text-3); cursor: pointer; }
  .nav-item.activo { color: var(--sky-bright); }
  .nav-item.activo::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 22px; height: 2.5px; border-radius: 2px; background: var(--sky-bright); }
  .nav-item span { font-family: 'Syne'; font-size: 9px; font-weight: 600; text-transform: uppercase; }

  /* Modales */
  .modal-overlay { position: fixed; inset: 0; z-index: 100; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); }
  .modal-overlay.activo { display: flex; }
  .modal-sheet { width: 100%; max-width: 480px; max-height: 90vh; background: #0d1e38; border: 1px solid var(--border-hi); border-top-left-radius: var(--r-2xl); border-top-right-radius: var(--r-2xl); display: flex; flex-direction: column; overflow: hidden; animation: slideUp 0.3s ease-out; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-body { padding: 25px; overflow-y: auto; flex: 1; }
  
  .lf-group { margin-bottom: 14px; }
  .lf-label { display: block; font-family: 'Syne'; font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; margin-bottom: 7px; }
  .lf-input, .lf-select, .lf-textarea { width: 100%; padding: 12px; background: rgba(255,255,255,0.07); border: 1px solid var(--border-hi); border-radius: 12px; color: white; font-size: 15px; }

  .item-fila { display: flex; align-items: center; gap: 12px; padding: 15px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 8px; cursor: pointer; }
  .color-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: rgba(255,255,255,0.08); border-radius: 20px; font-size: 11px; margin: 2px; }
  .color-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .color-btn { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .color-btn.selected { border-color: white; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
    <h1 style="font-family:'Syne'; font-size: 32px; color: white;">Ti Registro</h1>
    <p style="color: gray; margin-bottom: 30px;">Acceso Privado Empresa</p>
    <div class="card">
        <input type="email" id="email" class="lf-input" placeholder="Email Corporativo">
        <input type="password" id="password" class="lf-input" placeholder="Contraseña">
        <button onclick="handleLogin()" class="btn-accion btn-ingreso" style="width: 100%; margin-top: 10px;">Entrar</button>
        <p id="login-error" style="color: #ff9090; font-size: 12px; margin-top: 10px; display: none;"></p>
    </div>
</div>

<!-- APP -->
<div id="app">
  <header style="text-align:center; margin-bottom:20px;">
    <div style="font-family:'Cormorant Garamond'; font-size:24px; font-style:italic;">Registro TI</div>
    <div id="user-display" style="font-size:9px; color:gray; text-transform:uppercase; letter-spacing:2px;">Cargando...</div>
  </header>

  <!-- VISTAS -->
  <section class="vista activa" id="vista-inicio">
    <div class="card">
      <div class="lf-label">Saldo Actual ARS</div>
      <div class="saldo-valor" id="saldoValor">$ 0</div>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;">
      <button class="btn-accion btn-ingreso" onclick="abrirModalMov('ingreso')">Ingreso</button>
      <button class="btn-accion btn-egreso" onclick="abrirModalMov('egreso')">Egreso</button>
    </div>
    <div id="movLista"></div>
  </section>

  <section class="vista" id="vista-cuentas">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <span class="lf-label">Cuentas Bancarias / Efectivo</span>
        <button onclick="abrirModalCuenta()" style="background:var(--sky); border:none; color:white; padding:5px 12px; border-radius:8px; font-size:10px; font-family:'Syne';">+ NUEVA</button>
    </div>
    <div id="cuentasLista"></div>
  </section>

  <section class="vista" id="vista-categorias">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <span class="lf-label">Categorías de Gasto</span>
        <button onclick="abrirModalCategoria()" style="background:var(--sky); border:none; color:white; padding:5px 12px; border-radius:8px; font-size:10px; font-family:'Syne';">+ NUEVA</button>
    </div>
    <div id="categoriasLista"></div>
  </section>

  <section class="vista" id="vista-etiquetas">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <span class="lf-label">Etiquetas Especiales</span>
        <button onclick="abrirModalEtiqueta()" style="background:var(--sky); border:none; color:white; padding:5px 12px; border-radius:8px; font-size:10px; font-family:'Syne';">+ NUEVA</button>
    </div>
    <div id="etiquetasLista" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
  </section>
</div>

<!-- NAV INFERIOR -->
<nav class="bottom-nav">
  <button class="nav-item activo" onclick="cambiarVista('inicio', this)"><span>Inicio</span></button>
  <button class="nav-item" onclick="cambiarVista('cuentas', this)"><span>Cuentas</span></button>
  <button class="nav-item" onclick="cambiarVista('categorias', this)"><span>Categorías</span></button>
  <button class="nav-item" onclick="cambiarVista('etiquetas', this)"><span>Etiquetas</span></button>
</nav>

<!-- MODALES -->

<!-- 1. Modal Movimiento -->
<div class="modal-overlay" id="modalMov">
  <div class="modal-sheet">
    <div class="modal-body">
      <h2 id="modalMovTitulo" style="font-family:'Syne'; margin-bottom:20px;">Nuevo</h2>
      <input type="text" id="movConcepto" class="lf-input" placeholder="Concepto">
      <input type="text" id="movContraparte" class="lf-input" placeholder="De quién / A quién">
      
      <div style="display:flex; gap:10px;">
        <input type="number" id="movMonto" class="lf-input" placeholder="Monto" oninput="updateARS()">
        <select id="movMoneda" class="lf-select" style="width:100px;" onchange="toggleCotiz()">
          <option value="ARS">ARS</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
        </select>
      </div>
      
      <div id="movCotizDiv" style="display:none; margin-top:10px;">
        <label class="lf-label">Cotización 1 <span id="spanMoneda">USD</span> = ARS</label>
        <input type="number" id="movCotizacion" class="lf-input" value="1000" oninput="updateARS()">
        <p id="movEquiv" style="font-size:11px; color:var(--sky-bright); margin-top:5px;"></p>
      </div>

      <div style="display:flex; gap:10px; margin-top:10px;">
        <select id="movCuenta" class="lf-select"></select>
        <select id="movCategoria" class="lf-select"></select>
      </div>

      <div class="lf-group" style="margin-top:10px;">
        <label class="lf-label">Etiquetas</label>
        <select id="movEtiquetaSel" class="lf-select" onchange="addTagToMov()"></select>
        <div id="movTagsList" style="margin-top:10px;"></div>
      </div>

      <button onclick="saveMovimiento()" class="btn-accion btn-ingreso" style="width:100%; margin-top:20px;">Confirmar</button>
      <button onclick="closeModal('modalMov')" style="width:100%; background:none; border:none; color:gray; margin-top:15px; font-family:'Syne';">CANCELAR</button>
    </div>
  </div>
</div>

<!-- 2. Modal Cuenta -->
<div class="modal-overlay" id="modalCuenta">
    <div class="modal-sheet">
      <div class="modal-body">
        <h2 style="font-family:'Syne';">Nueva Cuenta</h2>
        <input type="text" id="accNombre" class="lf-input" placeholder="Nombre (Ej: Banco Galicia)">
        <select id="accMoneda" class="lf-select">
            <option value="ARS">ARS - Peso Argentino</option>
            <option value="USD">USD - Dólar</option>
        </select>
        <label class="lf-label" style="margin-top:15px;">Elegir Color</label>
        <div class="color-picker" id="accColorPicker"></div>
        <button onclick="saveCuenta()" class="btn-accion btn-ingreso" style="width:100%; margin-top:25px;">Guardar Cuenta</button>
        <button onclick="closeModal('modalCuenta')" style="width:100%; background:none; border:none; color:gray; margin-top:15px;">CANCELAR</button>
      </div>
    </div>
</div>

<!-- 3. Modal Categoría -->
<div class="modal-overlay" id="modalCategoria">
    <div class="modal-sheet">
      <div class="modal-body">
        <h2 style="font-family:'Syne';">Nueva Categoría</h2>
        <input type="text" id="catNombre" class="lf-input" placeholder="Ej: Publicidad o Sueldos">
        <select id="catTipo" class="lf-select">
            <option value="egreso">Tipo: Egreso</option>
            <option value="ingreso">Tipo: Ingreso</option>
            <option value="ambas">Tipo: Ambas</option>
        </select>
        <select id="catPadre" class="lf-select" style="margin-top:10px;">
            <option value="">Es Categoría Principal</option>
        </select>
        <label class="lf-label" style="margin-top:15px;">Elegir Color</label>
        <div class="color-picker" id="catColorPicker"></div>
        <button onclick="saveCategoria()" class="btn-accion btn-ingreso" style="width:100%; margin-top:25px;">Guardar Categoría</button>
        <button onclick="closeModal('modalCategoria')" style="width:100%; background:none; border:none; color:gray; margin-top:15px;">CANCELAR</button>
      </div>
    </div>
</div>

<!-- 4. Modal Etiqueta -->
<div class="modal-overlay" id="modalEtiqueta">
    <div class="modal-sheet">
      <div class="modal-body">
        <h2 style="font-family:'Syne';">Nueva Etiqueta</h2>
        <input type="text" id="tagNombre" class="lf-input" placeholder="Ej: Urgente, Pendiente...">
        <div class="color-picker" id="tagColorPicker"></div>
        <button onclick="saveEtiqueta()" class="btn-accion btn-ingreso" style="width:100%; margin-top:25px;">Guardar Etiqueta</button>
        <button onclick="closeModal('modalEtiqueta')" style="width:100%; background:none; border:none; color:gray; margin-top:15px;">CANCELAR</button>
      </div>
    </div>
</div>

<script>
/* --- CONFIGURACIÓN SUPABASE --- */
const SUPABASE_URL = 'https://lnbioecdbxkhjwmezwgv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_W9BRolWbAnNqP2giJQMvOQ_LsFV8fmd';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const COLORES = ['#55b3f5', '#2cb87a', '#e04444', '#d9a63e', '#c8a85a', '#9b6fd6', '#e0679a', '#3fc7c0'];

let user = null;
let movs = [], cuentas = [], categorias = [], etiquetas = [];
let selectedTagsForMov = [];
let selectedColor = COLORES[0];
let currentTipo = 'ingreso';

/* --- AUTH --- */
async function checkUser() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (session) {
        user = session.user;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('user-display').innerText = user.email;
        loadData();
    }
}

async function handleLogin() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { error } = await _supabase.auth.signInWithPassword({ email, password });
    if (error) {
        document.getElementById('login-error').innerText = "Error: Datos incorrectos";
        document.getElementById('login-error').style.display = 'block';
    } else {
        checkUser();
    }
}

/* --- CARGA Y RENDERS --- */
async function loadData() {
    const [rM, rC, rCat, rE] = await Promise.all([
        _supabase.from('movimientos').select('*, movimiento_etiquetas(etiqueta_id)').order('fecha', { ascending: false }),
        _supabase.from('cuentas').select('*'),
        _supabase.from('categorias').select('*'),
        _supabase.from('etiquetas').select('*')
    ]);
    
    movs = (rM.data || []).map(m => ({ ...m, etiquetaIds: m.movimiento_etiquetas.map(e => e.etiqueta_id) }));
    cuentas = rC.data || [];
    categorias = rCat.data || [];
    etiquetas = rE.data || [];
    
    renderEverything();
}

function renderEverything() {
    renderBalance();
    renderMovimientos();
    renderCuentas();
    renderCategorias();
    renderEtiquetas();
    fillSelects();
}

function renderBalance() {
    let bal = 0;
    movs.forEach(m => bal += (m.tipo === 'ingreso' ? m.monto_ars : -m.monto_ars));
    document.getElementById('saldoValor').innerText = `$ ${bal.toLocaleString('es-AR')}`;
}

function renderMovimientos() {
    document.getElementById('movLista').innerHTML = movs.map(m => `
        <div class="item-fila">
            <div class="color-dot" style="background:${m.tipo === 'ingreso' ? 'var(--green)' : 'var(--red)'}"></div>
            <div style="flex:1">
                <div style="font-weight:600; font-size:14px;">${m.concepto}</div>
                <div style="font-size:10px; color:gray;">${new Date(m.fecha).toLocaleDateString()} • ${m.contraparte || ''}</div>
            </div>
            <div style="font-family:var(--font-num); font-weight:700; color:${m.tipo === 'ingreso' ? '#5de09a' : '#ff9090'}">
                ${m.tipo === 'ingreso' ? '+' : '-'} $${m.monto_ars.toLocaleString()}
            </div>
        </div>
    `).join('');
}

function renderCuentas() {
    document.getElementById('cuentasLista').innerHTML = cuentas.map(c => `
        <div class="item-fila">
            <div class="color-dot" style="background:${c.color}"></div>
            <div style="flex:1"><b>${c.nombre}</b></div>
            <div style="font-size:12px;">${c.moneda}</div>
        </div>
    `).join('');
}

function renderCategorias() {
    document.getElementById('categoriasLista').innerHTML = categorias.map(c => `
        <div class="item-fila">
            <div class="color-dot" style="background:${c.color}"></div>
            <div style="flex:1">${c.nombre}</div>
            <div style="font-size:9px; color:gray; text-transform:uppercase;">${c.tipo}</div>
        </div>
    `).join('');
}

function renderEtiquetas() {
    document.getElementById('etiquetasLista').innerHTML = etiquetas.map(e => `
        <div class="chip">
            <div class="color-dot" style="background:${e.color}"></div>
            ${e.nombre}
        </div>
    `).join('');
}

function fillSelects() {
    document.getElementById('movCuenta').innerHTML = '<option value="">Cuenta</option>' + cuentas.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
    document.getElementById('movCategoria').innerHTML = '<option value="">Categoría</option>' + categorias.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
    document.getElementById('movEtiquetaSel').innerHTML = '<option value="">+ Etiqueta</option>' + etiquetas.map(e => `<option value="${e.id}">${e.nombre}</option>`).join('');
    document.getElementById('catPadre').innerHTML = '<option value="">Es Principal</option>' + categorias.filter(c => !c.padre_id).map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
}

/* --- FUNCIONES UI --- */
function cambiarVista(id, btn) {
    document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa'));
    document.getElementById('vista-' + id).classList.add('activa');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('activo'));
    btn.classList.add('activo');
}

function renderPickers() {
    const html = COLORES.map(c => `<div class="color-btn ${c === selectedColor ? 'selected' : ''}" style="background:${c}" onclick="pickColor('${c}')"></div>`).join('');
    document.getElementById('accColorPicker').innerHTML = html;
    document.getElementById('catColorPicker').innerHTML = html;
    document.getElementById('tagColorPicker').innerHTML = html;
}

function pickColor(c) { selectedColor = c; renderPickers(); }

function closeModal(id) { document.getElementById(id).classList.remove('activo'); }

/* --- GUARDADO (SUPABASE) --- */

// Movimiento
function abrirModalMov(tipo) {
    currentTipo = tipo;
    selectedTagsForMov = [];
    document.getElementById('modalMovTitulo').innerText = tipo === 'ingreso' ? 'Registrar Ingreso' : 'Registrar Egreso';
    document.getElementById('modalMovTitulo').style.color = tipo === 'ingreso' ? 'var(--green)' : 'var(--red)';
    document.getElementById('movTagsList').innerHTML = "";
    document.getElementById('modalMov').classList.add('activo');
}

function toggleCotiz() {
    const m = document.getElementById('movMoneda').value;
    document.getElementById('movCotizDiv').style.display = m === 'ARS' ? 'none' : 'block';
    document.getElementById('spanMoneda').innerText = m;
}

function updateARS() {
    const m = parseFloat(document.getElementById('movMonto').value) || 0;
    const c = parseFloat(document.getElementById('movCotizacion').value) || 1;
    document.getElementById('movEquiv').innerText = m > 0 && c > 1 ? `Equivale a $ ${(m*c).toLocaleString()} ARS` : "";
}

function addTagToMov() {
    const id = document.getElementById('movEtiquetaSel').value;
    if (id && !selectedTagsForMov.includes(id)) {
        selectedTagsForMov.push(id);
        const e = etiquetas.find(x => x.id === id);
        document.getElementById('movTagsList').innerHTML += `<span class="chip">${e.nombre}</span>`;
    }
}

async function saveMovimiento() {
    const monto = parseFloat(document.getElementById('movMonto').value);
    const cotiz = parseFloat(document.getElementById('movCotizacion').value) || 1;
    
    const { data: mov, error } = await _supabase.from('movimientos').insert([{
        user_id: user.id,
        tipo: currentTipo,
        concepto: document.getElementById('movConcepto').value,
        contraparte: document.getElementById('movContraparte').value,
        monto,
        cotizacion: cotiz,
        monto_ars: monto * cotiz,
        moneda: document.getElementById('movMoneda').value,
        cuenta_id: document.getElementById('movCuenta').value || null,
        categoria_id: document.getElementById('movCategoria').value || null,
        fecha: new Date().toISOString()
    }]).select().single();

    if (error) return alert(error.message);
    
    if (selectedTagsForMov.length > 0) {
        const rels = selectedTagsForMov.map(t => ({ movimiento_id: mov.id, etiqueta_id: t }));
        await _supabase.from('movimiento_etiquetas').insert(rels);
    }
    
    closeModal('modalMov');
    loadData();
}

// Cuenta
function abrirModalCuenta() { selectedColor = COLORES[0]; renderPickers(); document.getElementById('modalCuenta').classList.add('activo'); }
async function saveCuenta() {
    await _supabase.from('cuentas').insert([{ user_id: user.id, nombre: document.getElementById('accNombre').value, moneda: document.getElementById('accMoneda').value, color: selectedColor }]);
    closeModal('modalCuenta'); loadData();
}

// Categoría
function abrirModalCategoria() { selectedColor = COLORES[1]; renderPickers(); document.getElementById('modalCategoria').classList.add('activo'); }
async function saveCategoria() {
    await _supabase.from('categorias').insert([{ user_id: user.id, nombre: document.getElementById('catNombre').value, tipo: document.getElementById('catTipo').value, padre_id: document.getElementById('catPadre').value || null, color: selectedColor }]);
    closeModal('modalCategoria'); loadData();
}

    await _supabase.from('etiquetas').insert([{ user_id: user.id, nombre: document.getElementById('tagNombre').value, color: selectedColor }]);
    closeModal('modalEtiqueta'); loadData();
}

checkUser();
