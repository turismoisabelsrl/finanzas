<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TI Registro — Sistema Privado</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --navy:        #071020;
    --sky:         #3a8fd1;
    --sky-bright:  #55b3f5;
    --sky-glow:    rgba(55,170,245,0.16);
    --gold:        #c8a85a;
    --green:       #2cb87a;
    --green-bg:    rgba(44,184,122,0.12);
    --red:         #e04444;
    --red-bg:      rgba(224,68,68,0.12);
    --amber:       #d9a63e;
    --text-0:      #ffffff;
    --text-1:      rgba(255,255,255,0.85);
    --text-2:      rgba(180,210,240,0.65);
    --text-3:      rgba(140,175,215,0.45);
    --border:      rgba(255,255,255,0.08);
    --border-hi:   rgba(255,255,255,0.14);
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px; --r-2xl: 28px;
    --font-num: 'Inter', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--navy); color: var(--text-1); min-height: 100vh; overflow-x: hidden; position: relative; }
  body::before { content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse 900px 600px at 60% -10%, #0e2555 0%, transparent 60%), radial-gradient(ellipse 600px 500px at 0% 100%, #0a1e44 0%, transparent 55%), var(--navy); }
  
  #app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 22px 16px 100px; display: none; }
  #login-screen { position: relative; z-index: 10; max-width: 400px; margin: 80px auto; padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; }

  header.topbar { text-align: center; margin-bottom: 20px; }
  .brand-orb { width: 64px; height: 64px; margin: 0 auto 10px; position: relative; display: flex; align-items: center; justify-content: center; }
  .brand-orb img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; z-index: 1; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .brand-title { font-family: 'Cormorant Garamond', serif; font-size: 25px; font-style: italic; color: var(--text-0); }
  .brand-sub { font-family: 'Syne', sans-serif; font-size: 9px; text-transform: uppercase; color: var(--text-3); letter-spacing: 0.2em; }

  .vista { display: none; }
  .vista.activa { display: block; animation: revealUp 0.3s ease-out; }
  @keyframes revealUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  .card { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: var(--r-2xl); padding: 22px 20px; backdrop-filter: blur(20px); }
  .saldo-valor { font-family: var(--font-num); font-size: 34px; font-weight: 800; color: var(--text-0); margin: 6px 0; }
  
  .resumen-fila { display: flex; gap: 10px; margin-top: 16px; }
  .resumen-item { flex: 1; border-radius: var(--r-lg); padding: 12px 14px; border: 1px solid rgba(255,255,255,0.1); }
  .resumen-item.ing { background: var(--green-bg); color: #5de09a; }
  .resumen-item.egr { background: var(--red-bg); color: #ff9090; }

  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
  .btn-accion { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; border-radius: var(--r-xl); border: none; font-family: 'Syne'; font-weight: 700; text-transform: uppercase; cursor: pointer; }
  .btn-ingreso { background: rgba(44,184,122,0.2); color: #5de09a; border: 1px solid rgba(44,184,122,0.3); }
  .btn-egreso { background: rgba(224,68,68,0.2); color: #ff9090; border: 1px solid rgba(224,68,68,0.3); }

  .lista { display: flex; flex-direction: column; gap: 8px; }
  .item-fila { display: flex; align-items: center; gap: 12px; padding: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: var(--r-lg); cursor: pointer; }
  .item-fila.sub { margin-left: 20px; opacity: 0.8; }
  .color-dot { width: 12px; height: 12px; border-radius: 50%; }
  
  .mov-dot { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .mov-dot.ing { background: var(--green-bg); color: #5de09a; }
  .mov-dot.egr { background: var(--red-bg); color: #ff9090; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; max-width: 480px; margin: 0 auto; background: rgba(10,20,38,0.8); backdrop-filter: blur(15px); border-top: 1px solid var(--border); z-index: 100; }
  .nav-item { flex: 1; padding: 12px 0; text-align: center; color: var(--text-3); background: none; border: none; cursor: pointer; }
  .nav-item.activo { color: var(--sky-bright); border-top: 2px solid var(--sky-bright); }
  .nav-item span { display: block; font-size: 9px; font-family: 'Syne'; text-transform: uppercase; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: flex-end; justify-content: center; z-index: 200; backdrop-filter: blur(4px); }
  .modal-overlay.activo { display: flex; }
  .modal-sheet { width: 100%; max-width: 480px; background: #0d1e38; border-radius: 24px 24px 0 0; padding: 24px; max-height: 90vh; overflow-y: auto; }

  .lf-group { margin-bottom: 16px; }
  .lf-label { display: block; font-size: 10px; font-family: 'Syne'; color: var(--text-3); text-transform: uppercase; margin-bottom: 6px; }
  .lf-input, .lf-select, .lf-textarea { width: 100%; padding: 12px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-hi); border-radius: 12px; color: #fff; outline: none; }
  .lf-row { display: flex; gap: 10px; }
  
  .btn-guardar { width: 100%; padding: 14px; border-radius: 12px; border: none; color: #fff; font-family: 'Syne'; font-weight: 700; cursor: pointer; text-transform: uppercase; }
  .btn-guardar.ing { background: var(--green); }
  .btn-guardar.egr { background: var(--red); }
  .btn-guardar.neutro { background: var(--sky); }

  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(255,255,255,0.08); border-radius: 20px; font-size: 12px; margin: 4px; }
  .color-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .color-dot-pick { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .color-dot-pick.selected { border-color: #fff; }
</style>
</head>

  <div class="brand-title">Registro</div>
  <div class="brand-sub">Ingresos y Egresos</div>
  
  <div class="card" style="width: 100%; margin-top: 30px; max-width: 340px;">
    <div class="lf-group">
      <label class="lf-label">Usuario / Email</label>
      <input type="email" id="email" class="lf-input" placeholder="ejemplo@correo.com">
    </div>
    <div class="lf-group">
      <label class="lf-label">Contraseña</label>
      <input type="password" id="password" class="lf-input" placeholder="••••••••">
    </div>
    <button onclick="handleLogin()" class="btn-main">Entrar</button>
    <p id="login-error" style="color:var(--red); font-size:12px; margin-top:15px; display:none;"></p>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand-orb"><img src="data:image/png;base64,iVBORw0KGgoAAA..." alt="Logo"></div>
    <div class="brand-title">Registro</div>
    <div class="brand-sub">Ingresos y Egresos</div>
  </header>

  <section class="vista activa" id="vista-inicio">
    <div class="card">
      <div class="saldo-label">Saldo actual</div>
      <div class="saldo-valor" id="saldoValor">$ 0</div>
      <div class="saldo-moneda">Pesos argentinos (ARS)</div>
      <div class="resumen-fila">
        <div class="resumen-item ing">
          <div class="resumen-item-label">Ingresos</div>
          <div class="resumen-item-valor" id="totalIngresos">$ 0</div>
        </div>
        <div class="resumen-item egr">
          <div class="resumen-item-label">Egresos</div>
          <div class="resumen-item-valor" id="totalEgresos">$ 0</div>
        </div>
      </div>
    </div>

    <div class="acciones">
      <button class="btn-accion btn-ingreso" onclick="abrirModalMovimiento('ingreso')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        Ingreso
      </button>
      <button class="btn-accion btn-egreso" onclick="abrirModalMovimiento('egreso')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
        Egreso
      </button>
    </div>

    <div class="fila-titulo">
      <div class="vista-titulo">Movimientos</div>
      <button class="btn-filtro" id="btnFiltro" onclick="abrirFiltro()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
        Filtrar
      </button>
    </div>
    <div class="filtros-activos" id="filtrosActivos"></div>
    <div class="lista" id="movLista">
      <div class="cargando"><div class="spinner"></div><p>Cargando</p></div>
    </div>
  </section>

  <section class="vista" id="vista-cuentas">
    <div class="fila-titulo"><div class="vista-titulo">Cuentas</div><button class="btn-nuevo" onclick="abrirModalCuenta()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Nueva</button></div>
    <div class="lista" id="cuentasLista"></div>
  </section>

  <section class="vista" id="vista-categorias">
    <div class="fila-titulo"><div class="vista-titulo">Categorías</div><button class="btn-nuevo" onclick="abrirModalCategoria()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Nueva</button></div>
    <div class="segmented"><button id="segEgreso" class="activo" onclick="cambiarSegmentoCategoria('egreso')">Egreso</button><button id="segIngreso" onclick="cambiarSegmentoCategoria('ingreso')">Ingreso</button></div>
    <div class="lista" id="categoriasLista"></div>
  </section>

  <section class="vista" id="vista-etiquetas">
    <div class="fila-titulo"><div class="vista-titulo">Etiquetas</div><button class="btn-nuevo" onclick="abrirModalEtiqueta()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Nueva</button></div>
    <div class="etiquetas-grid" id="etiquetasLista"></div>
  </section>

<script>
/* === CREDENCIALES SUPABASE === */
const SUPABASE_URL = 'https://lnbioecdbxkhjwmezwgv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_W9BRolWbAnNqP2giJQMvOQ_LsFV8fmd';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const COLORES = ['#55b3f5', '#2cb87a', '#e04444', '#d9a63e', '#c8a85a', '#9b6fd6', '#e0679a', '#3fc7c0'];
let user = null, cuentas = [], categorias = [], etiquetas = [], movimientos = [];
let vistaActual = 'inicio', tipoActual = 'ingreso', modoRapido = false;
let colorElegidoCuenta = COLORES[0], colorElegidoCategoria = COLORES[0], colorElegidoEtiqueta = COLORES[0];
let cuentaEditandoId = null, categoriaEditandoId = null, etiquetaEditandoId = null;
let etiquetasSeleccionadas = [], tipoCatForm = 'egreso';
let filtro = { cuenta_id: '', categoria_id: '' };

/* === AUTH === */
async function checkUser() {
  const { data: { session } } = await _supabase.auth.getSession();
  if (session) {
    user = session.user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    fetchData();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
  }
}

async function handleLogin() {
  const e = document.getElementById('email').value, p = document.getElementById('password').value;
  const { error } = await _supabase.auth.signInWithPassword({ email: e, password: p });
  if (error) { const err = document.getElementById('login-error'); err.innerText = "Error: " + error.message; err.style.display = 'block'; }
  else checkUser();
}

async function logout() { await _supabase.auth.signOut(); window.location.reload(); }

/* === DATA === */
async function fetchData() {
  const [rC, rCat, rE, rM] = await Promise.all([
    _supabase.from('cuentas').select('*'),
    _supabase.from('categorias').select('*'),
    _supabase.from('etiquetas').select('*'),
    _supabase.from('movimientos').select('*, movimiento_etiquetas(etiqueta_id)').order('fecha', { ascending: false })
  ]);
  cuentas = rC.data || [];
  categorias = rCat.data || [];
  etiquetas = rE.data || [];
  movimientos = (rM.data || []).map(m => ({ ...m, etiquetaIds: m.movimiento_etiquetas.map(x => x.etiqueta_id) }));
  renderTodaLaApp();
}

/* === RENDERERS === */
function fmtARS(n) { return '$ ' + Number(n || 0).toLocaleString('es-AR', { minimumFractionDigits: 0 }); }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function renderTodaLaApp() { renderInicio(); renderCuentas(); renderCategorias(); renderEtiquetas(); }

function renderInicio() {
  let lista = movimientos.slice();
  if (filtro.cuenta_id) lista = lista.filter(m => m.cuenta_id === filtro.cuenta_id);
  if (filtro.categoria_id) lista = lista.filter(m => m.categoria_id === filtro.categoria_id);

  const ing = lista.filter(m => m.tipo === 'ingreso').reduce((a, m) => a + Number(m.monto_ars), 0);
  const egr = lista.filter(m => m.tipo === 'egreso').reduce((a, m) => a + Number(m.monto_ars), 0);
  const saldo = ing - egr;

  document.getElementById('saldoValor').textContent = fmtARS(saldo);
  document.getElementById('totalIngresos').textContent = fmtARS(ing);
  document.getElementById('totalEgresos').textContent = fmtARS(egr);

  const cont = document.getElementById('movLista');
  if (!lista.length) { cont.innerHTML = '<div class="vacio">No hay movimientos</div>'; return; }
  cont.innerHTML = lista.map(m => `
    <div class="item-fila" onclick="verDetalle('${m.id}')">
      <div class="mov-dot ${m.tipo === 'ingreso'?'ing':'egr'}">${m.tipo==='ingreso'?'↑':'↓'}</div>
      <div class="mov-body">
        <div class="mov-title">${escapeHtml(m.concepto)} ${m.archivo_path?'📎':''}</div>
        <div class="mov-meta">${new Date(m.fecha).toLocaleDateString()}</div>
      </div>
      <div class="mov-right"><div class="mov-monto ${m.tipo==='ingreso'?'ing':'egr'}">${m.tipo==='ingreso'?'+':'−'}${fmtARS(m.monto_ars)}</div></div>
    </div>`).join('');
}

function renderCuentas() {
  document.getElementById('cuentasLista').innerHTML = cuentas.map(c => `
    <div class="item-fila" onclick="abrirModalCuenta('${c.id}')">
      <div class="color-dot" style="background:${c.color}"></div>
      <div class="item-body">${escapeHtml(c.nombre)}</div>
    </div>`).join('');
}

function renderCategorias() {
  const padres = categorias.filter(c => !c.padre_id && (c.tipo === segmentoCategoria || c.tipo === 'ambas'));
  document.getElementById('categoriasLista').innerHTML = padres.map(p => `
    <div class="item-fila" onclick="abrirModalCategoria('${p.id}')"><div class="color-dot" style="background:${p.color}"></div>${escapeHtml(p.nombre)}</div>
    ${categorias.filter(c => c.padre_id === p.id).map(s => `<div class="item-fila sub" onclick="abrirModalCategoria('${s.id}')"><div class="color-dot" style="background:${s.color}"></div>${escapeHtml(s.nombre)}</div>`).join('')}
  `).join('');
}

function renderEtiquetas() {
  document.getElementById('etiquetasLista').innerHTML = etiquetas.map(e => `
    <div class="etiqueta-tarjeta" onclick="abrirModalEtiqueta('${e.id}')">
      <div class="color-dot" style="background:${e.color}"></div>${escapeHtml(e.nombre)}
    </div>`).join('');
}

/* === MODALS LOGIC === */
function cambiarVista(v) {
  document.querySelectorAll('.vista').forEach(x => x.classList.remove('activa'));
  document.getElementById('vista-'+v).classList.add('activa');
  document.querySelectorAll('.nav-item').forEach(x => x.classList.toggle('activo', x.dataset.vista === v));
  vistaActual = v;
}

function abrirModalMovimiento(t) {
  tipoActual = t; etiquetasSeleccionadas = [];
  document.getElementById('modalTitulo').textContent = t === 'ingreso'?'Nuevo Ingreso':'Nuevo Egreso';
  document.getElementById('inpFecha').valueAsDate = new Date();
  document.getElementById('inpHora').value = new Date().toTimeString().slice(0,5);
  document.getElementById('inpMonto').value = ''; document.getElementById('inpConcepto').value = '';
  document.getElementById('chipsEtiquetas').innerHTML = '';
  poblarSelectsMov();
  document.getElementById('modalOverlay').classList.add('activo');
}

function poblarSelectsMov() {
  document.getElementById('inpCuenta').innerHTML = '<option value="">Sin cuenta</option>' + cuentas.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('') + '<option value="NUEVA">+ Nueva Cuenta</option>';
  const cats = categorias.filter(c => c.tipo === tipoActual || c.tipo === 'ambas');
  document.getElementById('inpCategoria').innerHTML = '<option value="">Sin categoría</option>' + cats.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('') + '<option value="NUEVA">+ Nueva Categoría</option>';
  document.getElementById('inpEtiquetaSelect').innerHTML = '<option value="">Agregar Etiqueta</option>' + etiquetas.map(e => `<option value="${e.id}">${e.nombre}</option>`).join('') + '<option value="NUEVA">+ Nueva Etiqueta</option>';
}

function onAddEtiqueta() {
  const s = document.getElementById('inpEtiquetaSelect');
  if (s.value === 'NUEVA') { abrirModalEtiqueta(null, true); s.value = ''; return; }
  if (s.value && !etiquetasSeleccionadas.includes(s.value)) {
    etiquetasSeleccionadas.push(s.value);
    const e = etiquetas.find(x => x.id === s.value);
    document.getElementById('chipsEtiquetas').innerHTML += `<span class="chip">${e.nombre}</span>`;
  }
  s.value = '';
}

/* === CRUD SUPABASE === */
async function guardarMovimiento() {
  const monto = parseFloat(document.getElementById('inpMonto').value);
  const concepto = document.getElementById('inpConcepto').value;
  const fecha = document.getElementById('inpFecha').value, hora = document.getElementById('inpHora').value;
  if (!monto || !concepto) return;

  const moneda = document.getElementById('inpMoneda').value;
  const cotiz = moneda === 'ARS' ? 1 : (parseFloat(document.getElementById('inpCotizacion').value) || 1);

  const { data: mov, error } = await _supabase.from('movimientos').insert([{
    user_id: user.id, tipo: tipoActual, concepto, contraparte: document.getElementById('inpContraparte').value,
    monto, cotizacion: cotiz, moneda, cuenta_id: document.getElementById('inpCuenta').value || null,
    categoria_id: document.getElementById('inpCategoria').value || null,
    fecha: new Date(`${fecha}T${hora}`).toISOString()
  }]).select().single();

  if (error) { alert(error.message); return; }

  if (etiquetasSeleccionadas.length) {
    await _supabase.from('movimiento_etiquetas').insert(etiquetasSeleccionadas.map(id => ({ movimiento_id: mov.id, etiqueta_id: id })));
  }

  const fileInput = document.getElementById('inpArchivo');
  if (fileInput.files[0]) {
    const file = fileInput.files[0], path = `${user.id}/${mov.id}/${file.name}`;
    await _supabase.storage.from('comprobantes').upload(path, file);
    await _supabase.from('movimientos').update({ archivo_path: path, archivo_tipo: file.type }).eq('id', mov.id);
  }

  cerrarModal('modalOverlay'); fetchData();
}

async function verDetalle(id) {
  const m = movimientos.find(x => x.id === id);
  let arch = '';
  if (m.archivo_path) {
    const { data } = await _supabase.storage.from('comprobantes').createSignedUrl(m.archivo_path, 60);
    arch = `<div class="detalle-row"><a href="${data.signedUrl}" target="_blank" class="detalle-archivo-link">Ver Comprobante</a></div>`;
  }
  document.getElementById('detalleBody').innerHTML = `
    <div class="detalle-row"><div class="detalle-label">Monto</div><div class="detalle-valor">${fmtARS(m.monto_ars)}</div></div>
    <div class="detalle-row"><div class="detalle-label">Concepto</div><div class="detalle-valor">${escapeHtml(m.concepto)}</div></div>
    <div class="detalle-row"><div class="detalle-label">Fecha</div><div class="detalle-valor">${new Date(m.fecha).toLocaleString()}</div></div>
    ${arch}
    <button class="btn-eliminar" onclick="borrarMov('${m.id}')" style="margin-top:15px;">Eliminar</button>`;
  document.getElementById('detalleOverlay').classList.add('activo');
}

async function borrarMov(id) {
  const m = movimientos.find(x => x.id === id);
  if (m.archivo_path) await _supabase.storage.from('comprobantes').remove([m.archivo_path]);
  await _supabase.from('movimientos').delete().eq('id', id);
  cerrarModal('detalleOverlay'); fetchData();
}

/* === HELPERS UI === */
function cerrarModal(id) { document.getElementById(id).classList.remove('activo'); }
function onCambioMoneda() { document.getElementById('grupoCotizacion').style.display = document.getElementById('inpMoneda').value==='ARS'?'none':'block'; }
function actualizarPreviewARS() { 
  const m = parseFloat(document.getElementById('inpMonto').value) || 0;
  const c = parseFloat(document.getElementById('inpCotizacion').value) || 1;
  document.getElementById('previewARS').textContent = document.getElementById('inpMoneda').value==='ARS'?'': '≈ ' + fmtARS(m * c);
}

function cambiarSegmentoCategoria(s) { 
  segmentoCategoria = s; 
  document.getElementById('segEgreso').classList.toggle('activo', s==='egreso');
  document.getElementById('segIngreso').classList.toggle('activo', s==='ingreso');
  renderCategorias(); 
}

function onCambioSelectCuenta() { if (document.getElementById('inpCuenta').value==='NUEVA') abrirModalCuenta(null, true); }
function onCambioSelectCategoria() { if (document.getElementById('inpCategoria').value==='NUEVA') abrirModalCategoria(null, true); }

function renderColorPick(id, sel, f) {
  document.getElementById(id).innerHTML = COLORES.map(c => `<div class="color-dot-pick ${c===sel?'selected':''}" style="background:${c}" onclick="${f}('${c}')"></div>`).join('');
}

function pickC(c) { colorElegidoCuenta = c; renderColorPick('colorPickerCuenta', c, 'pickC'); }
function pickCat(c) { colorElegidoCategoria = c; renderColorPick('colorPickerCategoria', c, 'pickCat'); }
function pickEt(c) { colorElegidoEtiqueta = c; renderColorPick('colorPickerEtiqueta', c, 'pickEt'); }

/* === CRUD AUXILIAR === */
function abrirModalCuenta(id, r) {
  cuentaEditandoId = id; modoRapido = r;
  const c = id ? cuentas.find(x => x.id === id) : null;
  document.getElementById('inpCuentaNombre').value = c ? c.nombre : '';
  pickC(c ? c.color : COLORES[0]);
  document.getElementById('modalCuentaOverlay').classList.add('activo');
}

async function guardarCuenta() {
  const n = document.getElementById('inpCuentaNombre').value, m = document.getElementById('inpCuentaMoneda').value;
  const p = { user_id: user.id, nombre: n, moneda: m, color: colorElegidoCuenta };
  if (cuentaEditandoId) await _supabase.from('cuentas').update(p).eq('id', cuentaEditandoId);
  else await _supabase.from('cuentas').insert([p]);
  cerrarModal('modalCuentaOverlay'); fetchData();
}

function setTipoCat(t) {
  tipoCatForm = t;
  document.getElementById('btnTipoEgreso').classList.toggle('activo', t==='egreso');
  document.getElementById('btnTipoIngreso').classList.toggle('activo', t==='ingreso');
  document.getElementById('btnTipoAmbas').classList.toggle('activo', t==='ambas');
}

function abrirModalCategoria(id, r) {
  categoriaEditandoId = id; modoRapido = r;
  const c = id ? categorias.find(x => x.id === id) : null;
  document.getElementById('inpCategoriaNombre').value = c ? c.nombre : '';
  setTipoCat(c ? c.tipo : 'egreso');
  pickCat(c ? c.color : COLORES[0]);
  const padres = categorias.filter(x => !x.padre_id && x.id !== id);
  document.getElementById('inpCategoriaPadre').innerHTML = '<option value="">Principal</option>' + padres.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');
  document.getElementById('inpCategoriaPadre').value = c ? (c.padre_id || '') : '';
  document.getElementById('modalCategoriaOverlay').classList.add('activo');
}

async function guardarCategoria() {
  const n = document.getElementById('inpCategoriaNombre').value;
  const p = { user_id: user.id, nombre: n, tipo: tipoCatForm, padre_id: document.getElementById('inpCategoriaPadre').value || null, color: colorElegidoCategoria };
  if (categoriaEditandoId) await _supabase.from('categorias').update(p).eq('id', categoriaEditandoId);
  else await _supabase.from('categorias').insert([p]);
  cerrarModal('modalCategoriaOverlay'); fetchData();
}

function abrirModalEtiqueta(id, r) {
  etiquetaEditandoId = id; modoRapido = r;
  const e = id ? etiquetas.find(x => x.id === id) : null;
  document.getElementById('inpEtiquetaNombre').value = e ? e.nombre : '';
  pickEt(e ? e.color : COLORES[0]);
  document.getElementById('modalEtiquetaOverlay').classList.add('activo');
}

async function guardarEtiqueta() {
  const n = document.getElementById('inpEtiquetaNombre').value;
  const p = { user_id: user.id, nombre: n, color: colorElegidoEtiqueta };
  if (etiquetaEditandoId) await _supabase.from('etiquetas').update(p).eq('id', etiquetaEditandoId);
  else await _supabase.from('etiquetas').insert([p]);
  cerrarModal('modalEtiquetaOverlay'); fetchData();
}

function abrirFiltro() {
  document.getElementById('filtroCuenta').innerHTML = '<option value="">Todas</option>' + cuentas.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
  document.getElementById('filtroCategoria').innerHTML = '<option value="">Todas</option>' + categorias.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
  document.getElementById('filtroOverlay').classList.add('activo');
}

function aplicarFiltros() {
  filtro.cuenta_id = document.getElementById('filtroCuenta').value;
  filtro.categoria_id = document.getElementById('filtroCategoria').value;
  cerrarModal('filtroOverlay'); renderInicio();
}

checkUser();
</script>
</body>
</html>
