<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Registro — Ingresos y Egresos</title>

<!-- SDK Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --navy:        #071020;
    --sky:         #3a8fd1;
    --sky-bright:  #55b3f5;
    --sky-glow:    rgba(55,170,245,0.16);
    --gold:        #c8a85a;
    --green:       #2cb87a;
    --green-bg:    rgba(44,184,122,0.12);
    --red:         #e04444;
    --red-bg:      rgba(224,68,68,0.12);
    --amber:       #d9a63e;
    --text-0:      #ffffff;
    --text-1:      rgba(255,255,255,0.85);
    --text-2:      rgba(180,210,240,0.65);
    --text-3:      rgba(140,175,215,0.45);
    --border:      rgba(255,255,255,0.08);
    --border-hi:   rgba(255,255,255,0.14);
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px; --r-2xl: 28px;
    --font-num: 'Inter', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy);
    color: var(--text-1);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }
  body::before {
    content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 900px 600px at 60% -10%, #0e2555 0%, transparent 60%),
                radial-gradient(ellipse 600px 500px at 0% 100%, #0a1e44 0%, transparent 55%), var(--navy);
  }
  
  #login-screen { position: relative; z-index: 10; max-width: 400px; margin: 80px auto; padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  #app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 22px 16px 110px; min-height: 100vh; display: none; }

  header.topbar { text-align: center; margin-bottom: 20px; }
  .brand-orb { width: 64px; height: 64px; margin: 0 auto 10px; position: relative; display: flex; align-items: center; justify-content: center; }
  .brand-orb img { width: 100%; height: 100%; border-radius: 50%; object-fit: contain; z-index: 1; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4)); }
  .brand-title { font-family: 'Cormorant Garamond', serif; font-size: 27px; font-style: italic; color: var(--text-0); }
  .brand-sub { font-family: 'Syne', sans-serif; font-size: 9px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-3); margin-top: 4px; }

  .vista { display: none; animation: revealUp 0.3s cubic-bezier(0.22,1,0.36,1) both; }
  .vista.activa { display: block; }

  .card { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: var(--r-2xl); padding: 22px 20px; backdrop-filter: blur(20px); }
  .saldo-valor { font-family: var(--font-num); font-size: 34px; font-weight: 800; color: var(--text-0); margin-top: 6px; }
  .saldo-valor.negativo { color: #ff9090; }

  .resumen-fila { display: flex; gap: 10px; margin-top: 16px; }
  .resumen-item { flex: 1; border-radius: var(--r-lg); padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
  .resumen-item.ing { background: var(--green-bg); border: 1px solid rgba(44,184,122,0.22); }
  .resumen-item.egr { background: var(--red-bg); border: 1px solid rgba(224,68,68,0.22); }
  .resumen-item-valor { font-family: var(--font-num); font-size: 15px; font-weight: 600; }
  .resumen-item.ing .resumen-item-valor { color: #5de09a; }
  .resumen-item.egr .resumen-item-valor { color: #ff9090; }

  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
  .btn-accion { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px 12px; border-radius: var(--r-xl); border: none; cursor: pointer; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; }
  .btn-ingreso { background: linear-gradient(135deg, rgba(44,184,122,0.26), rgba(44,184,122,0.12)); border: 1.5px solid rgba(44,184,122,0.35); color: #5de09a; }
  .btn-egreso { background: linear-gradient(135deg, rgba(224,68,68,0.22), rgba(224,68,68,0.10)); border: 1.5px solid rgba(224,68,68,0.32); color: #ff9090; }

  .fila-titulo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .vista-titulo { font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); }
  
  .btn-nuevo, .btn-filtro { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: var(--r-lg); border: none; font-family: 'Syne', sans-serif; font-size: 11.5px; font-weight: 700; cursor: pointer; }
  .btn-nuevo { background: linear-gradient(135deg, var(--sky), var(--sky-bright)); color: #fff; text-transform: uppercase; }
  .btn-filtro { background: rgba(255,255,255,0.06); border: 1px solid var(--border-hi); color: var(--text-1); }
  .btn-filtro.activo { background: rgba(85,179,245,0.15); border-color: rgba(85,179,245,0.4); color: var(--sky-bright); }

  .item-fila { display: flex; align-items: center; gap: 12px; padding: 14px 15px; border-radius: var(--r-lg); background: rgba(255,255,255,0.04); border: 1px solid var(--border); cursor: pointer; margin-bottom: 8px; }
  .item-fila.sub { margin-left: 20px; background: rgba(255,255,255,0.02); }
  .mov-dot { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .mov-dot.ing { background: var(--green-bg); color: #5de09a; }
  .mov-dot.egr { background: var(--red-bg); color: #ff9090; }
  .mov-body { flex: 1; min-width: 0; }
  .mov-concepto { font-size: 14px; font-weight: 600; color: var(--text-0); display: flex; align-items: center; gap: 6px; }
  .mov-meta { font-size: 11.5px; color: var(--text-3); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mov-monto { font-family: var(--font-num); font-size: 15px; font-weight: 700; text-align: right; flex-shrink: 0; }
  .mov-monto.ing { color: #5de09a; }
  .mov-monto.egr { color: #ff9090; }

  /* SEGMENTED BUTTONS COLORS */
  .segmented { display: flex; background: rgba(255,255,255,0.05); border: 1px solid var(--border-hi); border-radius: var(--r-md); padding: 4px; gap: 4px; margin-bottom: 16px; }
  .segmented button { flex: 1; padding: 10px 8px; border-radius: var(--r-sm); border: none; background: transparent; color: var(--text-3); font-family: 'Syne', sans-serif; font-size: 11.5px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
  
  /* Lógica de colores según el tipo solicitado */
  #segEgreso.activo, #btnTipoEgreso.activo { background: rgba(224, 68, 68, 0.2); color: #ff9090; border: 1px solid rgba(224, 68, 68, 0.4); }
  #segIngreso.activo, #btnTipoIngreso.activo { background: rgba(44, 184, 122, 0.2); color: #5de09a; border: 1px solid rgba(44, 184, 122, 0.4); }
  #btnTipoAmbas.activo { background: rgba(85, 179, 245, 0.2); color: var(--sky-bright); border: 1px solid rgba(85, 179, 245, 0.4); }

  .etiqueta-tarjeta { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 20px; font-size: 13px; cursor: pointer; }

  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: flex; max-width: 480px; margin: 0 auto; background: rgba(7,16,32,0.85); backdrop-filter: blur(18px); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 12px 0 10px; background: none; border: none; color: var(--text-3); cursor: pointer; position: relative; }
  .nav-item.activo { color: var(--sky-bright); }
  .nav-item.activo::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 2.5px; border-radius: 2px; background: var(--sky-bright); }
  .nav-item span { font-family: 'Syne', sans-serif; font-size: 9px; font-weight: 600; text-transform: uppercase; }

  .modal-overlay { position: fixed; inset: 0; z-index: 100; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0.65); backdrop-filter: blur(5px); }
  .modal-overlay.activo { display: flex; }
  .modal-sheet { width: 100%; max-width: 480px; max-height: 90vh; background: #0d1e38; border: 1px solid var(--border-hi); border-radius: var(--r-2xl) var(--r-2xl) 0 0; display: flex; flex-direction: column; overflow: hidden; }
  .modal-head { padding: 22px 20px 8px; flex-shrink: 0; }
  .modal-titulo { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 700; color: var(--text-0); }
  .modal-body { padding: 14px 20px 4px; overflow-y: auto; flex: 1; }
  .modal-foot { padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px)); flex-shrink: 0; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }

  .lf-group { margin-bottom: 14px; }
  .lf-label { display: block; font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--text-3); margin-bottom: 7px; }
  .lf-input, .lf-select, .lf-textarea { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-hi); border-radius: var(--r-md); font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text-0); outline: none; }
  .lf-row { display: flex; gap: 10px; }

  .btn-main { width: 100%; padding: 16px; border-radius: 16px; background: linear-gradient(135deg, var(--sky), var(--sky-bright)); color: #fff; font-family: 'Syne', sans-serif; font-weight: 800; text-transform: uppercase; border: none; cursor: pointer; }
  .btn-guardar { flex: 1; padding: 14px; border-radius: var(--r-md); border: none; cursor: pointer; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; color: #fff; }
  .btn-guardar.neutro { background: linear-gradient(135deg, var(--sky), #2a6ea8); }
  .btn-cancelar { flex: 1; padding: 14px; border-radius: var(--r-md); border: 1px solid var(--border-hi); background: rgba(255,255,255,0.06); color: var(--text-1); font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
  .btn-eliminar { width: 100%; padding: 14px; border-radius: var(--r-md); border: 1px solid rgba(224,68,68,0.3); background: rgba(224,68,68,0.12); color: #ff9090; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; cursor: pointer; }

  .detalle-row { padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .detalle-label { font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--text-3); margin-bottom: 5px; }
  .detalle-valor { font-size: 15px; color: var(--text-1); }

  .color-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .color-dot-pick { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .color-dot-pick.selected { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 10px rgba(255,255,255,0.3); }
</style>
</head>
<body>

<!-- ===== PANTALLA LOGIN ===== -->
<div id="login-screen">
  <div class="brand-orb">
    <img src="TU_LOGO_AQUI.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135673.png'" alt="Logo">
  </div>
  <div class="brand-title">Registro</div>
  <div class="brand-sub">Ingresos y Egresos</div>
  
  <div class="card" style="width: 100%; margin-top: 32px; max-width: 340px;">
    <div class="lf-group"><label class="lf-label" style="text-align:left;">Email</label><input type="email" id="email" class="lf-input" placeholder="ejemplo@correo.com"></div>
    <div class="lf-group"><label class="lf-label" style="text-align:left;">Contraseña</label><input type="password" id="password" class="lf-input" placeholder="••••••••"></div>
    <button onclick="handleLogin()" class="btn-main">Entrar</button>
    <p id="login-error" style="color:var(--red); font-size:12px; margin-top:15px; display:none;"></p>
  </div>
</div>

<!-- ===== APP PRINCIPAL ===== -->
<div id="app">
  <header class="topbar">
    <div class="brand-orb">
      <img src="TU_LOGO_AQUI.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135673.png'" alt="Logo">
    </div>
    <div class="brand-title">Registro</div>
    <div class="brand-sub">Ingresos y Egresos</div>
  </header>

  <!-- VISTA INICIO -->
  <section class="vista activa" id="vista-inicio">
    <div class="card">
      <div class="saldo-label">Saldo actual</div>
      <div class="saldo-valor" id="saldoValor">$ 0</div>
      <div class="saldo-moneda">Pesos argentinos (ARS)</div>
      <div class="resumen-fila">
        <div class="resumen-item ing"><div class="resumen-item-label">Ingresos</div><div class="resumen-item-valor" id="totalIngresos">$ 0</div></div>
        <div class="resumen-item egr"><div class="resumen-item-label">Egresos</div><div class="resumen-item-valor" id="totalEgresos">$ 0</div></div>
      </div>
    </div>

    <div class="acciones">
      <button class="btn-accion btn-ingreso" onclick="abrirModalMovimiento('ingreso')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        Ingreso
      </button>
      <button class="btn-accion btn-egreso" onclick="abrirModalMovimiento('egreso')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
        Egreso
      </button>
    </div>

    <div class="fila-titulo">
      <div class="vista-titulo">Movimientos</div>
      <button class="btn-filtro" id="btnFiltro" onclick="abrirFiltro()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
        Filtrar
      </button>
    </div>
    <div id="movLista"></div>
  </section>

  <!-- VISTA CUENTAS -->
  <section class="vista" id="vista-cuentas">
    <div class="fila-titulo"><div class="vista-titulo">Cuentas</div><button class="btn-nuevo" onclick="abrirModalCuenta()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Nueva</button></div>
    <div class="lista" id="cuentasLista"></div>
  </section>

  <!-- VISTA CATEGORÍAS -->
  <section class="vista" id="vista-categorias">
    <div class="fila-titulo"><div class="vista-titulo">Categorías</div><button class="btn-nuevo" onclick="abrirModalCategoria()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Nueva</button></div>
    <div class="segmented">
        <button id="segEgreso" class="activo" onclick="cambiarSegmentoCategoria('egreso')">Egreso</button>
        <button id="segIngreso" onclick="cambiarSegmentoCategoria('ingreso')">Ingreso</button>
    </div>
    <div class="lista" id="categoriasLista"></div>
  </section>

  <!-- VISTA ETIQUETAS -->
  <section class="vista" id="vista-etiquetas">
    <div class="fila-titulo"><div class="vista-titulo">Etiquetas</div><button class="btn-nuevo" onclick="abrirModalEtiqueta()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Nueva</button></div>
    <div class="etiquetas-grid" id="etiquetasLista" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
  </section>

  <nav class="bottom-nav">
    <button class="nav-item activo" data-vista="inicio" onclick="cambiarVista('inicio')"><svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V9.5"/></svg><span>Inicio</span></button>
    <button class="nav-item" data-vista="cuentas" onclick="cambiarVista('cuentas')"><svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="16.5" cy="15" r="1.2" fill="currentColor" stroke="none"/></svg><span>Cuentas</span></button>
    <button class="nav-item" data-vista="categorias" onclick="cambiarVista('categorias')"><svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41L12 22l-9-9V4a1 1 0 011-1h9z"/><circle cx="7.5" cy="7.5" r="1.5" fill="currentColor" stroke="none"/></svg><span>Cat</span></button>
    <button class="nav-item" data-vista="etiquetas" onclick="cambiarVista('etiquetas')"><svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg><span>Tags</span></button>
    <button class="nav-item" onclick="logout()"><svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Salir</span></button>
  </nav>
</div>

<!-- MODAL: MOVIMIENTO -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet">
    <div class="modal-head"><div class="modal-titulo" id="modalTitulo">Nuevo movimiento</div></div>
    <div class="modal-body">
      <div class="lf-row">
        <div class="lf-group"><label class="lf-label">Fecha *</label><input type="date" class="lf-input" id="inpFecha"></div>
        <div class="lf-group"><label class="lf-label">Hora</label><input type="time" class="lf-input" id="inpHora"></div>
      </div>
      <div class="lf-group"><label class="lf-label">Monto (ARS) *</label><input type="number" step="any" class="lf-input" id="inpMonto" placeholder="0.00" style="font-size:18px; font-weight:700;"></div>
      <div class="lf-group"><label class="lf-label">Concepto (Opcional)</label><input type="text" class="lf-input" id="inpConcepto" placeholder="Ej: Venta, Alquiler..."></div>
      <div class="lf-group"><label class="lf-label">Cuenta</label><select class="lf-select" id="inpCuenta" onchange="onCambioSelectCuenta()"></select></div>
      <div class="lf-group"><label class="lf-label">Persona / Empresa</label><input type="text" class="lf-input" id="inpContraparte" placeholder="Nombre"></div>
      <div class="lf-group"><label class="lf-label">Categoría</label><select class="lf-select" id="inpCategoria" onchange="onCambioSelectCategoria()"></select></div>
      <div class="lf-group"><label class="lf-label">Etiquetas</label><select class="lf-select" id="inpEtiquetaSelect" onchange="onAddEtiqueta()"></select><div class="chips-wrap" id="chipsEtiquetas" style="display:flex; flex-wrap:wrap; gap:4px; margin-top:8px;"></div></div>
      <div class="lf-group"><label class="lf-label">Notas</label><textarea class="lf-textarea" id="inpNotas"></textarea></div>
      <div class="lf-group"><label class="lf-label">Comprobante</label><input type="file" id="inpArchivo" class="lf-input" accept="image/*,application/pdf"></div>
    </div>
    <div class="modal-foot">
      <div class="modal-botones">
        <button class="btn-cancelar" onclick="cerrarModal('modalOverlay')">Cerrar</button>
        <button class="btn-guardar" id="btnGuardar" onclick="guardarMovimiento()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: DETALLE -->
<div class="modal-overlay" id="detalleOverlay">
  <div class="modal-sheet">
    <div class="modal-head"><div class="modal-titulo">Detalle</div></div>
    <div class="modal-body" id="detalleBody"></div>
    <div class="modal-foot">
        <div class="modal-botones">
            <button class="btn-guardar neutro" id="btnEditarMov">Editar</button>
            <button class="btn-eliminar" id="btnEliminarMov" style="width: auto; flex:1;">Eliminar</button>
        </div>
        <button class="btn-cancelar" style="width:100%; flex:none;" onclick="cerrarModal('detalleOverlay')">Cerrar</button>

<script>
/* === CONFIG SUPABASE === */
const SUPABASE_URL = 'https://lnbioecdbxkhjwmezwgv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_W9BRolWbAnNqP2giJQMvOQ_LsFV8fmd';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const COLORES = ['#55b3f5', '#2cb87a', '#e04444', '#d9a63e', '#c8a85a', '#9b6fd6', '#e0679a', '#3fc7c0'];
let user = null, cuentas = [], categorias = [], etiquetas = [], movements = [];
let vistaActual = 'inicio', tipoActual = 'ingreso', segmentoCategoria = 'egreso';
let colorElegidoCuenta = COLORES[0], colorElegidoCategoria = COLORES[0], colorElegidoEtiqueta = COLORES[0];
let cuentaEditandoId = null, categoriaEditandoId = null, etiquetaEditandoId = null, movEditandoId = null;
let modoRapido = false, etiquetasSeleccionadas = [], tipoCatForm = 'egreso';
let filtro = { cuenta_id: '', categoria_id: '', etiqueta_id: '' };

/* === AUTH === */
async function checkUser() {
  const { data: { session } } = await _supabase.auth.getSession();
  if (session) {
    user = session.user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    fetchData();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
}

async function handleLogin() {
  const e = document.getElementById('email').value, p = document.getElementById('password').value;
  const { error } = await _supabase.auth.signInWithPassword({ email: e, password: p });
  if (error) { const err = document.getElementById('login-error'); err.innerText = "Error: " + error.message; err.style.display = 'block'; }
  else checkUser();
}

async function logout() { await _supabase.auth.signOut(); window.location.reload(); }

/* === DATA FETCH === */
async function fetchData() {
  const [rC, rCat, rE, rM] = await Promise.all([
    _supabase.from('cuentas').select('*').order('nombre'),
    _supabase.from('categorias').select('*').order('nombre'),
    _supabase.from('etiquetas').select('*').order('nombre'),
    _supabase.from('movimientos').select('*, movimiento_etiquetas(etiqueta_id)').order('fecha', { ascending: false })
  ]);
  cuentas = rC.data || [];
  categorias = rCat.data || [];
  etiquetas = rE.data || [];
  movements = (rM.data || []).map(m => ({ ...m, etiquetaIds: m.movimiento_etiquetas.map(x => x.etiqueta_id) }));
  renderTodaLaApp();
}

/* === RENDERERS === */
function fmtARS(n) { return '$ ' + Number(n || 0).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function renderTodaLaApp() { renderInicio(); renderCuentas(); renderCategorias(); renderEtiquetas(); }

function renderInicio() {
  let lista = movements.slice();
  if (filtro.cuenta_id) lista = lista.filter(m => m.cuenta_id === filtro.cuenta_id);
  if (filtro.categoria_id) lista = lista.filter(m => m.categoria_id === filtro.categoria_id);
  if (filtro.etiqueta_id) lista = lista.filter(m => m.etiquetaIds.includes(filtro.etiqueta_id));

  const ing = lista.filter(m => m.tipo === 'ingreso').reduce((a, m) => a + Number(m.monto_ars || m.monto), 0);
  const egr = lista.filter(m => m.tipo === 'egreso').reduce((a, m) => a + Number(m.monto_ars || m.monto), 0);
  const saldo = ing - egr;

  document.getElementById('saldoValor').textContent = fmtARS(saldo);
  document.getElementById('saldoValor').classList.toggle('negativo', saldo < 0);
  document.getElementById('totalIngresos').textContent = fmtARS(ing);
  document.getElementById('totalEgresos').textContent = fmtARS(egr);

  const cont = document.getElementById('movLista');
  if (!lista.length) { cont.innerHTML = '<div class="vacio">No hay movimientos registrados.</div>'; return; }
  
  cont.innerHTML = lista.map(m => {
    const cta = cuentas.find(c => c.id === m.cuenta_id);
    const cat = categorias.find(c => c.id === m.categoria_id);
    const esIng = m.tipo === 'ingreso';
    const conceptoStr = m.concepto ? escapeHtml(m.concepto) : '<span style="opacity:0.5; font-style:italic;">Sin concepto</span>';
    const catBadge = cat ? `<span class="mov-cat" style="background:${cat.color}22; color:${cat.color}; border:1px solid ${cat.color}44;">${escapeHtml(cat.nombre)}</span>` : '';
    
    return `
    <div class="item-fila" onclick="verDetalle('${m.id}')">
      <div class="mov-dot ${esIng?'ing':'egr'}">
        ${esIng ? '↑' : '↓'}
      </div>
      <div class="mov-body">
        <div class="mov-concepto">${conceptoStr}${catBadge}</div>
        <div class="mov-meta">${new Date(m.fecha).toLocaleString('es-AR', {hour12: false})} · ${cta ? escapeHtml(cta.nombre) : 'Sin cuenta'}</div>
      </div>
      <div class="mov-right">
        <div class="mov-monto ${esIng?'ing':'egr'}">${esIng?'+':'−'}${fmtARS(m.monto_ars || m.monto)}</div>
      </div>
    </div>`;
  }).join('');
}

function renderCuentas() {
  document.getElementById('cuentasLista').innerHTML = cuentas.map(c => `<div class="item-fila" onclick="abrirModalCuenta('${c.id}')"><div class="color-dot" style="background:${c.color}"></div><div class="item-body">${escapeHtml(c.nombre)}</div></div>`).join('');
}

function renderCategorias() {
  const filtered = categorias.filter(c => !c.padre_id && (c.tipo === segmentoCategoria || c.tipo === 'ambas'));
  document.getElementById('categoriasLista').innerHTML = filtered.map(p => `
    <div class="item-fila" onclick="abrirModalCategoria('${p.id}')"><div class="color-dot" style="background:${p.color}"></div><div class="item-body">${escapeHtml(p.nombre)}</div></div>
    ${categorias.filter(s => s.padre_id === p.id).map(s => `<div class="item-fila sub" onclick="abrirModalCategoria('${s.id}')"><div class="color-dot" style="background:${s.color}"></div><div class="item-body">— ${escapeHtml(s.nombre)}</div></div>`).join('')}
  `).join('');
}

function renderEtiquetas() {
  document.getElementById('etiquetasLista').innerHTML = etiquetas.map(e => `<div class="etiqueta-tarjeta" onclick="abrirModalEtiqueta('${e.id}')"><div class="color-dot" style="background:${e.color}"></div>${escapeHtml(e.nombre)}</div>`).join('');
}

/* === MODALS & UI === */
function cambiarVista(v) {
  document.querySelectorAll('.vista').forEach(x => x.classList.remove('activa'));
  document.getElementById('vista-'+v).classList.add('activa');
  document.querySelectorAll('.nav-item').forEach(x => x.classList.toggle('activo', x.dataset.vista === v));
  vistaActual = v;
}

function cerrarModal(id) { document.getElementById(id).classList.remove('activo'); }

// Cierre al tocar fuera del modal
document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
            cerrarModal(overlay.id);
        }
    });
});

function abrirModalMovimiento(t) {
  tipoActual = t; etiquetasSeleccionadas = []; movEditandoId = null;
  document.getElementById('modalTitulo').textContent = t === 'ingreso'?'Nuevo Ingreso':'Nuevo Egreso';
  document.getElementById('inpFecha').valueAsDate = new Date();
  document.getElementById('inpHora').value = new Date().toTimeString().slice(0,5);
  document.getElementById('inpMonto').value = ''; document.getElementById('inpConcepto').value = '';
  document.getElementById('inpContraparte').value = ''; document.getElementById('inpNotas').value = '';
  document.getElementById('chipsEtiquetas').innerHTML = '';
  poblarSelectsMov();
  document.getElementById('modalOverlay').classList.add('activo');
}

function poblarSelectsMov(selCta, selCat) {
  document.getElementById('inpCuenta').innerHTML = '<option value="">Sin cuenta</option>' + cuentas.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('') + '<option value="NUEVA">+ Nueva Cuenta</option>';
  const cats = categorias.filter(c => c.tipo === tipoActual || c.tipo === 'ambas');
  document.getElementById('inpCategoria').innerHTML = '<option value="">Sin categoría</option>' + cats.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('') + '<option value="NUEVA">+ Nueva Categoría</option>';
  document.getElementById('inpEtiquetaSelect').innerHTML = '<option value="">Agregar Etiqueta</option>' + etiquetas.map(e => `<option value="${e.id}">${e.nombre}</option>`).join('') + '<option value="NUEVA">+ Nueva Etiqueta</option>';
}

function onAddEtiqueta() {
  const s = document.getElementById('inpEtiquetaSelect');
  if (s.value === 'NUEVA') { abrirModalEtiqueta(null, true); s.value = ''; return; }
  if (s.value && !etiquetasSeleccionadas.includes(s.value)) {
    etiquetasSeleccionadas.push(s.value);
    const e = etiquetas.find(x => x.id === s.value);
    document.getElementById('chipsEtiquetas').innerHTML += `<span class="chip">${e.nombre} <strong onclick="quitarEtiqueta('${e.id}', event)">×</strong></span>`;
  }
  s.value = '';
}

function quitarEtiqueta(id, e) {
    e.stopPropagation();
    etiquetasSeleccionadas = etiquetasSeleccionadas.filter(x => x !== id);
    document.getElementById('chipsEtiquetas').innerHTML = etiquetasSeleccionadas.map(tid => {
        const tag = etiquetas.find(x => x.id === tid);
        return `<span class="chip">${tag.nombre} <strong onclick="quitarEtiqueta('${tag.id}', event)">×</strong></span>`;
    }).join('');
}

/* === CRUD SUPABASE === */
async function guardarMovimiento() {
  const monto = parseFloat(document.getElementById('inpMonto').value);
  const fecha = document.getElementById('inpFecha').value, hora = document.getElementById('inpHora').value;
  if (!monto || !fecha) { alert("Completa monto y fecha."); return; }

  const payload = {
    user_id: user.id, tipo: tipoActual, monto: monto, moneda: 'ARS', cotizacion: 1,
    concepto: document.getElementById('inpConcepto').value || null,
    contraparte: document.getElementById('inpContraparte').value || null,
    notas: document.getElementById('inpNotas').value || null,
    cuenta_id: document.getElementById('inpCuenta').value || null,
    categoria_id: document.getElementById('inpCategoria').value || null,
    fecha: new Date(`${fecha}T${hora}`).toISOString()
  };

  let movId = movEditandoId;
  if (movEditandoId) {
    await _supabase.from('movimientos').update(payload).eq('id', movEditandoId);
    await _supabase.from('movimiento_etiquetas').delete().eq('movimiento_id', movEditandoId);
  } else {
    const { data: mov } = await _supabase.from('movimientos').insert([payload]).select().single();
    movId = mov.id;
  }

  if (etiquetasSeleccionadas.length) {
    await _supabase.from('movimiento_etiquetas').insert(etiquetasSeleccionadas.map(id => ({ movimiento_id: movId, etiqueta_id: id })));
  }

  const fileInput = document.getElementById('inpArchivo');
  if (fileInput.files[0]) {
    const file = fileInput.files[0], path = `${user.id}/${movId}/${file.name}`;
    await _supabase.storage.from('comprobantes').upload(path, file);
    await _supabase.from('movimientos').update({ archivo_path: path, archivo_tipo: file.type }).eq('id', movId);
  }

  cerrarModal('modalOverlay'); fetchData();
}

async function verDetalle(id) {
  const m = movements.find(x => x.id === id);
  let arch = '';
  if (m.archivo_path) {
    const { data } = await _supabase.storage.from('comprobantes').createSignedUrl(m.archivo_path, 60);
    arch = `<div class="detalle-row"><a href="${data.signedUrl}" target="_blank" class="detalle-archivo-link">Abrir Comprobante</a></div>`;
  }
  document.getElementById('detalleBody').innerHTML = `
    <div class="detalle-row"><div class="detalle-label">Monto</div><div class="detalle-valor" style="font-weight:700; color:${m.tipo==='ingreso'?'#5de09a':'#ff9090'};">${fmtARS(m.monto_ars || m.monto)}</div></div>
    <div class="detalle-row"><div class="detalle-label">Concepto</div><div class="detalle-valor">${escapeHtml(m.concepto) || 'Sin concepto'}</div></div>
    <div class="detalle-row"><div class="detalle-label">Fecha</div><div class="detalle-valor">${new Date(m.fecha).toLocaleString('es-AR', {hour12: false})}</div></div>
    ${arch}`;

  document.getElementById('btnEditarMov').onclick = () => editarMovimiento(id);
  document.getElementById('btnEliminarMov').onclick = () => borrarMov(id);
  document.getElementById('detalleOverlay').classList.add('activo');
}

function editarMovimiento(id) {
  const m = movements.find(x => x.id === id);
  cerrarModal('detalleOverlay');
  movEditandoId = m.id;
  tipoActual = m.tipo;
  document.getElementById('inpMonto').value = m.monto;
  document.getElementById('inpConcepto').value = m.concepto || '';
  document.getElementById('inpContraparte').value = m.contraparte || '';
  document.getElementById('inpNotas').value = m.notas || '';
  document.getElementById('inpFecha').value = m.fecha.split('T')[0];
  document.getElementById('inpHora').value = new Date(m.fecha).toTimeString().slice(0, 5);
  etiquetasSeleccionadas = [...m.etiquetaIds];
  poblarSelectsMov(m.cuenta_id, m.categoria_id);
  document.getElementById('modalOverlay').classList.add('activo');
}

async function borrarMov(id) {
  if(!confirm("¿Eliminar movimiento?")) return;
  await _supabase.from('movimientos').delete().eq('id', id);
  cerrarModal('detalleOverlay'); fetchData();
}

/* === CRUD AUXILIAR === */
function pickC(c) { colorElegidoCuenta = c; renderColorPick('colorPickerCuenta', c, 'pickC'); }
function pickCat(c) { colorElegidoCategoria = c; renderColorPick('colorPickerCategoria', c, 'pickCat'); }
function pickEt(c) { colorElegidoEtiqueta = c; renderColorPick('colorPickerEtiqueta', c, 'pickEt'); }

function renderColorPick(id, sel, f) {
  document.getElementById(id).innerHTML = COLORES.map(c => `<div class="color-dot-pick ${c===sel?'selected':''}" style="background:${c}" onclick="${f}('${c}')"></div>`).join('');
}

function setTipoCat(t) {
  tipoCatForm = t;
  document.getElementById('btnTipoEgreso').className = t==='egreso'?'activo':'';
  document.getElementById('btnTipoIngreso').className = t==='ingreso'?'activo':'';
  document.getElementById('btnTipoAmbas').className = t==='ambas'?'activo':'';
}

function cambiarSegmentoCategoria(s) { 
  segmentoCategoria = s; 
  document.getElementById('segEgreso').className = s==='egreso'?'activo':'';
  document.getElementById('segIngreso').className = s==='ingreso'?'activo':'';
  renderCategorias(); 
}

function abrirModalCuenta(id, r) {
  cuentaEditandoId = id; modoRapido = r;
  const c = id ? cuentas.find(x => x.id === id) : null;
  document.getElementById('inpCuentaNombre').value = c ? c.nombre : '';
  pickC(c ? c.color : COLORES[0]);
  document.getElementById('modalCuentaOverlay').classList.add('activo');
}

async function guardarCuenta() {
  const n = document.getElementById('inpCuentaNombre').value;
  const p = { user_id: user.id, nombre: n, moneda: 'ARS', color: colorElegidoCuenta };
  const { data } = cuentaEditandoId ? await _supabase.from('cuentas').update(p).eq('id', cuentaEditandoId).select() : await _supabase.from('cuentas').insert([p]).select();
  cerrarModal('modalCuentaOverlay'); fetchData();
  if(modoRapido) poblarSelectsMov(data[0].id);
}

function abrirModalCategoria(id, r) {
  categoriaEditandoId = id; modoRapido = r;
  const c = id ? categorias.find(x => x.id === id) : null;
  document.getElementById('inpCategoriaNombre').value = c ? c.nombre : '';
  setTipoCat(c ? c.tipo : 'egreso');
  pickCat(c ? c.color : COLORES[0]);
  const padres = categorias.filter(x => !x.padre_id && x.id !== id);
  document.getElementById('inpCategoriaPadre').innerHTML = '<option value="">Principal</option>' + padres.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');
  document.getElementById('inpCategoriaPadre').value = c ? (c.padre_id || '') : '';
  document.getElementById('modalCategoriaOverlay').classList.add('activo');
}

async function guardarCategoria() {
  const n = document.getElementById('inpCategoriaNombre').value;
  const p = { user_id: user.id, nombre: n, tipo: tipoCatForm, padre_id: document.getElementById('inpCategoriaPadre').value || null, color: colorElegidoCategoria };
  const { data } = categoriaEditandoId ? await _supabase.from('categorias').update(p).eq('id', categoriaEditandoId).select() : await _supabase.from('categorias').insert([p]).select();
  cerrarModal('modalCategoriaOverlay'); fetchData();
  if(modoRapido) poblarSelectsMov(undefined, data[0].id);
}

function abrirModalEtiqueta(id, r) {
  etiquetaEditandoId = id; modoRapido = r;
  const e = id ? etiquetas.find(x => x.id === id) : null;
  document.getElementById('inpEtiquetaNombre').value = e ? e.nombre : '';
  pickEt(e ? e.color : COLORES[0]);
  document.getElementById('modalEtiquetaOverlay').classList.add('activo');
}

async function guardarEtiqueta() {
  const n = document.getElementById('inpEtiquetaNombre').value;
  const p = { user_id: user.id, nombre: n, color: colorElegidoEtiqueta };
  const { data } = etiquetaEditandoId ? await _supabase.from('etiquetas').update(p).eq('id', etiquetaEditandoId).select() : await _supabase.from('etiquetas').insert([p]).select();
  cerrarModal('modalEtiquetaOverlay'); fetchData();
  if(modoRapido) {
      etiquetasSeleccionadas.push(data[0].id);
      document.getElementById('chipsEtiquetas').innerHTML += `<span class="chip">${data[0].nombre} <strong onclick="quitarEtiqueta('${data[0].id}', event)">×</strong></span>`;
  }
}

function onCambioSelectCuenta() { if (document.getElementById('inpCuenta').value==='NUEVA') abrirModalCuenta(null, true); }
function onCambioSelectCategoria() { if (document.getElementById('inpCategoria').value==='NUEVA') abrirModalCategoria(null, true); }

function abrirFiltro() {
  document.getElementById('filtroCuenta').innerHTML = '<option value="">Todas las cuentas</option>' + cuentas.map(c => `<option value="${c.id}" ${filtro.cuenta_id === c.id ? 'selected':''}>${escapeHtml(c.nombre)}</option>`).join('');
  document.getElementById('filtroCategoria').innerHTML = '<option value="">Todas las categorías</option>' + categorias.map(c => `<option value="${c.id}" ${filtro.categoria_id === c.id ? 'selected':''}>${escapeHtml(c.nombre)}</option>`).join('');
  document.getElementById('filtroEtiqueta').innerHTML = '<option value="">Todas las etiquetas</option>' + etiquetas.map(e => `<option value="${e.id}" ${filtro.etiqueta_id === e.id ? 'selected':''}>${escapeHtml(e.nombre)}</option>`).join('');
  document.getElementById('filtroOverlay').classList.add('activo');
}

function aplicarFiltros() {
  filtro.cuenta_id = document.getElementById('filtroCuenta').value;
  filtro.categoria_id = document.getElementById('filtroCategoria').value;
  filtro.etiqueta_id = document.getElementById('filtroEtiqueta').value;
  cerrarModal('filtroOverlay'); renderInicio();
  document.getElementById('btnFiltro').className = (filtro.cuenta_id || filtro.categoria_id || filtro.etiqueta_id) ? 'btn-filtro activo' : 'btn-filtro';
}

function limpiarFiltros() {
  filtro = { cuenta_id: '', categoria_id: '', etiqueta_id: '' };
  cerrarModal('filtroOverlay'); renderInicio();
  document.getElementById('btnFiltro').className = 'btn-filtro';
}

checkUser();
</script>
</body>
</html>
