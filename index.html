<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TI Registro — Privado</title>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Fuentes -->
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Sans:wght@400;500&family=Inter:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --navy: #071020; --sky: #3a8fd1; --sky-bright: #55b3f5;
    --green: #2cb87a; --red: #e04444; --text-1: rgba(255,255,255,0.85);
    --text-3: rgba(140,175,215,0.45); --border: rgba(255,255,255,0.1);
    --r-lg: 16px; --r-xl: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'DM Sans', sans-serif; background: var(--navy); color: var(--text-1); min-height: 100vh; overflow-x: hidden; }
  
  /* Layout */
  #app { max-width: 480px; margin: 0 auto; padding: 20px 16px 100px; display: none; }
  .card { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 20px; backdrop-filter: blur(20px); margin-bottom: 15px; }

  /* Forms */
  .lf-group { margin-bottom: 16px; }
  .lf-label { display: block; font-family: 'Syne'; font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
  .lf-input, .lf-select, .lf-textarea { width: 100%; padding: 14px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 12px; color: white; font-size: 15px; outline: none; transition: 0.2s; }
  .lf-input:focus, .lf-select:focus { border-color: var(--sky); background: rgba(255,255,255,0.1); }
  
  /* Modales */
  .modal-overlay { position: fixed; inset: 0; z-index: 100; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
  .modal-overlay.activo { display: flex; }
  .modal-sheet { width: 100%; max-width: 480px; max-height: 92vh; background: #0d1e38; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; border-top: 1px solid var(--sky); animation: slideUp 0.3s ease-out; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
  
  /* Buttons */
  .btn-main { background: linear-gradient(135deg, var(--sky), #55b3f5); color: white; border: none; padding: 16px; border-radius: 14px; width: 100%; font-weight: 800; font-family: 'Syne'; text-transform: uppercase; cursor: pointer; }
  .btn-ghost { background: none; border: none; color: var(--text-3); font-family: 'Syne'; font-size: 12px; cursor: pointer; text-transform: uppercase; }

  /* Chips */
  .chips-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { padding: 6px 12px; background: rgba(58,143,209,0.15); color: var(--sky-bright); border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 6px; border: 1px solid rgba(58,143,209,0.3); }

  /* Login */
  #login-screen { max-width: 400px; margin: 100px auto; padding: 20px; text-align: center; }
</style>
</head>
<body>

<!-- 1. PANTALLA LOGIN -->
<div id="login-screen">
    <h1 style="font-family:'Syne'; font-size: 40px; color: white;">Ti</h1>
    <p style="color: gray; margin-bottom: 30px;">Registro Privado Empresa</p>
    <div class="card">
        <input type="email" id="email" class="lf-input" placeholder="Usuario">
        <input type="password" id="password" class="lf-input" placeholder="Contraseña" style="margin-top:10px;">
        <button onclick="handleLogin()" class="btn-main" style="margin-top: 20px;">Entrar</button>
        <p id="login-error" style="color:var(--red); font-size:12px; margin-top:15px; display:none;"></p>
    </div>
</div>

<!-- 2. APP PRINCIPAL -->
<div id="app">
    <header style="display:flex; justify-content:space-between; margin-bottom:20px;">
        <h2 style="font-family:'Syne'; font-size:22px;">Mi Balance</h2>
        <button onclick="logout()" class="btn-ghost">Salir</button>
    </header>

    <div class="card">
        <span class="lf-label">Saldo Total ARS</span>
        <div id="saldoValor" style="font-size:36px; font-weight:800; font-family:'Inter';">$ 0</div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:30px;">
        <button onclick="abrirFormMov('ingreso')" class="btn-main" style="background:var(--green)">+ Ingreso</button>
        <button onclick="abrirFormMov('egreso')" class="btn-main" style="background:var(--red)">- Egreso</button>
    </div>

    <div id="movLista"></div>
</div>

<!-- 3. MODAL: NUEVO MOVIMIENTO (EL CORAZÓN DEL SISTEMA) -->
<div class="modal-overlay" id="modalMov">
    <div class="modal-sheet">
        <div class="modal-header">
            <h2 id="movTitulo" style="font-family:'Syne'; font-size:18px;">Nuevo Movimiento</h2>
            <button onclick="cerrarModal('modalMov')" class="btn-ghost">Cerrar</button>
        </div>
        <div class="modal-body">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="lf-group">
                    <label class="lf-label">Fecha</label>
                    <input type="date" id="movFecha" class="lf-input">
                </div>
                <div class="lf-group">
                    <label class="lf-label">Hora</label>
                    <input type="time" id="movHora" class="lf-input">
                </div>
            </div>

            <div class="lf-group">
                <label class="lf-label">Concepto / Detalle</label>
                <input type="text" id="movConcepto" class="lf-input" placeholder="Ej: Venta de Pasajes">
            </div>

            <div class="lf-group">
                <label class="lf-label">Cuenta</label>
                <select id="movCuenta" class="lf-select" onchange="verificarNuevo(this, 'cuenta')"></select>
            </div>

            <div class="lf-group">
                <label class="lf-label" id="labelContraparte">Contraparte</label>
                <input type="text" id="movContraparte" class="lf-input" placeholder="Cliente o Proveedor">
            </div>

            <div class="lf-group">
                <label class="lf-label">Categoría</label>
                <select id="movCategoria" class="lf-select" onchange="verificarNuevo(this, 'categoria')"></select>
            </div>

            <div class="lf-group">
                <label class="lf-label">Etiquetas (Multiselección)</label>
                <select id="movEtiquetaSel" class="lf-select" onchange="addTag(this)"></select>
                <div id="movTagsList" class="chips-container"></div>
            </div>

            <div style="display:grid; grid-template-columns:1.5fr 1fr; gap:10px;">
                <div class="lf-group">
                    <label class="lf-label">Monto</label>
                    <input type="number" id="movMonto" class="lf-input" placeholder="0.00" oninput="calcARS()">
                </div>
                <div class="lf-group">
                    <label class="lf-label">Moneda</label>
                    <select id="movMoneda" class="lf-select" onchange="toggleCotiz()">
                        <option value="ARS">ARS</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                    </select>
                </div>
            </div>

            <div id="divCotiz" style="display:none;" class="card">
                <label class="lf-label">Cotización del día (1 USD/EUR = ARS)</label>
                <input type="number" id="movCotiz" class="lf-input" value="1000" oninput="calcARS()">
                <p id="txtEquiv" style="font-size:12px; color:var(--sky-bright); margin-top:10px; font-weight:700;"></p>
            </div>

            <div class="lf-group">
                <label class="lf-label">Notas Adicionales</label>
                <textarea id="movNotas" class="lf-input" rows="2"></textarea>
            </div>

            <button onclick="guardarMovimientoFinal()" class="btn-main" style="margin-top:10px;">Confirmar y Guardar</button>
        </div>
    </div>
</div>

<!-- 4. MODAL: CREACIÓN RÁPIDA (HIJO) -->
<div class="modal-overlay" id="modalRapido" style="z-index:200;">
    <div class="modal-sheet" style="max-height:60vh; border-top: 2px solid var(--green);">
        <div class="modal-header">
            <h2 id="rapidoTitulo" style="font-family:'Syne'; font-size:16px;">Nuevo Registro</h2>
            <button onclick="cerrarModal('modalRapido')" class="btn-ghost">Cancelar</button>
        </div>
        <div class="modal-body" id="rapidoBody">
            <!-- El contenido cambia según si es categoría, cuenta o etiqueta -->
        </div>
    </div>
</div>

<script>
/* --- CONFIGURACIÓN --- */
const SUPABASE_URL = 'https://lnbioecdbxkhjwmezwgv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_W9BRolWbAnNqP2giJQMvOQ_LsFV8fmd';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user = null;
let db = { cuentas: [], categorias: [], etiquetas: [], movimientos: [] };
let etiquetasEnMov = [];
let tipoM = 'ingreso';

/* --- AUTH --- */
async function checkUser() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (session) {
        user = session.user;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        fetchData();
    }
}

async function handleLogin() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { error } = await _supabase.auth.signInWithPassword({ email, password });
    if (error) {
        document.getElementById('login-error').innerText = "Datos incorrectos.";
        document.getElementById('login-error').style.display = 'block';
    } else {
        checkUser();
    }
}

async function logout() { await _supabase.auth.signOut(); window.location.reload(); }

/* --- DATA FETCH --- */
async function fetchData() {
    const [rC, rCat, rE, rM] = await Promise.all([
        _supabase.from('cuentas').select('*'),
        _supabase.from('categorias').select('*'),
        _supabase.from('etiquetas').select('*'),
        _supabase.from('movimientos').select('*, movimiento_etiquetas(etiqueta_id)').order('fecha', { ascending: false })
    ]);
    db.cuentas = rC.data || [];
    db.categorias = rCat.data || [];
    db.etiquetas = rE.data || [];
    db.movimientos = (rM.data || []).map(m => ({ ...m, tags: m.movimiento_etiquetas.map(x => x.etiqueta_id) }));
    renderAll();
}

function renderAll() {
    // Lista Inicio
    let bal = 0;
    document.getElementById('movLista').innerHTML = db.movimientos.map(m => {
        const esIng = m.tipo === 'ingreso';
        bal += esIng ? m.monto_ars : -m.monto_ars;
        return `<div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:15px;">
            <div><div style="font-weight:bold;">${m.concepto}</div><div style="font-size:10px; color:gray;">${new Date(m.fecha).toLocaleDateString()}</div></div>
            <div style="color:${esIng ? 'var(--green)' : 'var(--red)'}; font-weight:700;">${esIng?'+':'-'} $${m.monto_ars.toLocaleString()}</div>
        </div>`;
    }).join('');
    document.getElementById('saldoValor').innerText = `$ ${bal.toLocaleString()}`;

    // Selects
    poblarSelects();
}

function poblarSelects() {
    const sCuenta = document.getElementById('movCuenta');
    const sCat = document.getElementById('movCategoria');
    const sEt = document.getElementById('movEtiquetaSel');

    sCuenta.innerHTML = '<option value="">Sin Cuenta</option>' + db.cuentas.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('') + '<option value="__new__">+ CREAR NUEVA CUENTA...</option>';
    
    // Categorías con jerarquía visual
    let catHtml = '<option value="">Sin Categoría</option>';
    const padres = db.categorias.filter(c => !c.padre_id);
    padres.forEach(p => {
        catHtml += `<option value="${p.id}">${p.nombre}</option>`;
        db.categorias.filter(c => c.padre_id === p.id).forEach(sub => {
            catHtml += `<option value="${sub.id}">&nbsp;&nbsp;&nbsp;— ${sub.nombre}</option>`;
        });
    });
    sCat.innerHTML = catHtml + '<option value="__new__">+ CREAR NUEVA CATEGORÍA...</option>';

    sEt.innerHTML = '<option value="">Agregar Etiqueta</option>' + db.etiquetas.map(e => `<option value="${e.id}">${e.nombre}</option>`).join('') + '<option value="__new__">+ NUEVA ETIQUETA...</option>';
}

/* --- LOGICA FORMULARIO --- */
function abrirFormMov(tipo) {
    tipoM = tipo;
    etiquetasEnMov = [];
    document.getElementById('movTitulo').innerText = tipo === 'ingreso' ? 'Registrar Ingreso' : 'Registrar Egreso';
    document.getElementById('labelContraparte').innerText = tipo === 'ingreso' ? '¿Quién nos paga?' : '¿A quién pagamos?';
    document.getElementById('movFecha').valueAsDate = new Date();
    document.getElementById('movHora').value = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    document.getElementById('movTagsList').innerHTML = '';
    document.getElementById('modalMov').classList.add('activo');
}

function toggleCotiz() {
    document.getElementById('divCotiz').style.display = document.getElementById('movMoneda').value === 'ARS' ? 'none' : 'block';
    calcARS();
}

function calcARS() {
    const m = parseFloat(document.getElementById('movMonto').value) || 0;
    const c = parseFloat(document.getElementById('movCotiz').value) || 1;
    document.getElementById('txtEquiv').innerText = m > 0 && document.getElementById('movMoneda').value !== 'ARS' ? `EQUIVALE A $ ${(m * c).toLocaleString()} ARS` : '';
}

function addTag(sel) {
    if (sel.value === "__new__") {
        abrirRapido('etiqueta');
        sel.value = "";
        return;
    }
    if (sel.value && !etiquetasEnMov.includes(sel.value)) {
        etiquetasEnMov.push(sel.value);
        const tag = db.etiquetas.find(t => t.id === sel.value);
        document.getElementById('movTagsList').innerHTML += `<div class="chip">${tag.nombre}</div>`;
    }
    sel.value = "";
}

/* --- CREACION ON-THE-FLY --- */
function verificarNuevo(sel, tipo) {
    if (sel.value === "__new__") {
        abrirRapido(tipo);
        sel.value = "";
    }
}

function abrirRapido(tipo) {
    const body = document.getElementById('rapidoBody');
    const titulo = document.getElementById('rapidoTitulo');
    
    if (tipo === 'cuenta') {
        titulo.innerText = "Nueva Cuenta";
        body.innerHTML = `<input type="text" id="rNombre" class="lf-input" placeholder="Nombre (Ej: Banco Nación)">
                         <button onclick="guardarRapido('cuenta')" class="btn-main" style="margin-top:15px;">Crear y Seleccionar</button>`;
    } else if (tipo === 'categoria') {
        titulo.innerText = "Nueva Categoría";
        body.innerHTML = `<input type="text" id="rNombre" class="lf-input" placeholder="Nombre (Ej: Alquiler)">
                         <select id="rPadre" class="lf-select" style="margin-top:10px;">
                            <option value="">Es Categoría Principal</option>
                            ${db.categorias.filter(c => !c.padre_id).map(c => `<option value="${c.id}">Hija de: ${c.nombre}</option>`)}
                         </select>
                         <button onclick="guardarRapido('categoria')" class="btn-main" style="margin-top:15px;">Crear y Seleccionar</button>`;
    } else if (tipo === 'etiqueta') {
        titulo.innerText = "Nueva Etiqueta";
        body.innerHTML = `<input type="text" id="rNombre" class="lf-input" placeholder="Ej: Urgente">
                         <button onclick="guardarRapido('etiqueta')" class="btn-main" style="margin-top:15px;">Crear y Agregar</button>`;
    }
    document.getElementById('modalRapido').classList.add('activo');
}

async function guardarRapido(tipo) {
    const nombre = document.getElementById('rNombre').value;
    if (!nombre) return;

    let res;
    if (tipo === 'cuenta') {
        res = await _supabase.from('cuentas').insert([{ user_id: user.id, nombre, moneda: 'ARS', color: '#55b3f5' }]).select();
    } else if (tipo === 'categoria') {
        const padre = document.getElementById('rPadre').value;
        res = await _supabase.from('categorias').insert([{ user_id: user.id, nombre, tipo: 'ambas', padre_id: padre || null, color: '#c8a85a' }]).select();
    } else if (tipo === 'etiqueta') {
        res = await _supabase.from('etiquetas').insert([{ user_id: user.id, nombre, color: '#3fc7c0' }]).select();
    }

    if (res.data) {
        await fetchData(); // Refrescar base local
        cerrarModal('modalRapido');
        // Seleccionar automáticamente el nuevo
        if (tipo === 'cuenta') document.getElementById('movCuenta').value = res.data[0].id;
        if (tipo === 'categoria') document.getElementById('movCategoria').value = res.data[0].id;
        if (tipo === 'etiqueta') {
            etiquetasEnMov.push(res.data[0].id);
            document.getElementById('movTagsList').innerHTML += `<div class="chip">${res.data[0].nombre}</div>`;
        }
    }
}

/* --- GUARDADO FINAL --- */
async function guardarMovimientoFinal() {
    const concepto = document.getElementById('movConcepto').value;
    const monto = parseFloat(document.getElementById('movMonto').value);
    const cotiz = parseFloat(document.getElementById('movCotiz').value) || 1;
    
    if (!concepto || !monto) return alert("Concepto y monto son obligatorios.");

    const { data: mov, error } = await _supabase.from('movimientos').insert([{
        user_id: user.id,
        tipo: tipoM,
        concepto,
        contraparte: document.getElementById('movContraparte').value,
        monto,
        cotizacion: cotiz,
        monto_ars: monto * cotiz,
        moneda: document.getElementById('movMoneda').value,
        cuenta_id: document.getElementById('movCuenta').value || null,
        categoria_id: document.getElementById('movCategoria').value || null,
        notas: document.getElementById('movNotas').value,
        fecha: new Date(document.getElementById('movFecha').value + 'T' + document.getElementById('movHora').value).toISOString()
    }]).select().single();

    if (error) return alert(error.message);

    if (etiquetasEnMov.length > 0) {
        const rels = etiquetasEnMov.map(id => ({ movimiento_id: mov.id, etiqueta_id: id }));
        await _supabase.from('movimiento_etiquetas').insert(rels);
    }

    cerrarModal('modalMov');
    fetchData();
}

function cerrarModal(id) { document.getElementById(id).classList.remove('activo'); }

// Init
checkUser();
</script>
</body>
</html>
