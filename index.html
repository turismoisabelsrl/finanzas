<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Turismo Isabel — Ingresos y Egresos</title>

<!-- ===== PWA: instalable en Android / iPhone ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#071020">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turismo Isabel">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

<!-- SDK Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --navy:        #071020;
    --sky:         #3a8fd1;
    --sky-bright:  #55b3f5;
    --sky-glow:    rgba(55,170,245,0.16);
    --gold:        #c8a85a;
    --green:       #2cb87a;
    --green-bg:    rgba(44,184,122,0.12);
    --red:         #e04444;
    --red-bg:      rgba(224,68,68,0.12);
    --amber:       #d9a63e;
    --text-0:      #ffffff;
    --text-1:      rgba(255,255,255,0.85);
    --text-2:      rgba(180,210,240,0.65);
    --text-3:      rgba(140,175,215,0.45);
    --border:      rgba(255,255,255,0.08);
    --border-hi:   rgba(255,255,255,0.14);
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px; --r-2xl: 28px;
    --font-num: 'Inter', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy);
    color: var(--text-1);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 900px 600px at 60% -10%, #0e2555 0%, transparent 60%),
      radial-gradient(ellipse 600px 500px at 0% 100%, #0a1e44 0%, transparent 55%),
      var(--navy);
  }

  /* SPLASH SCREEN */
  #splash-screen {
    position: fixed; inset: 0; z-index: 10000;
    background: var(--navy);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.5s ease, visibility 0.5s;
  }
  #splash-screen::before {
    content: ''; position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(ellipse 900px 600px at 60% -10%, #0e2555 0%, transparent 60%),
                radial-gradient(ellipse 600px 500px at 0% 100%, #0a1e44 0%, transparent 55%), var(--navy);
  }
  #splash-screen.hidden { opacity: 0; visibility: hidden; }

  @keyframes revealUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes orbPulse { 0%,100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 0.4; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  #login-screen { position: relative; z-index: 10; max-width: 400px; margin: 80px auto; padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  #app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 22px 16px 110px; min-height: 100vh; display: none; }

  header.topbar { text-align: center; margin-bottom: 20px; }
  .brand-orb { width: 64px; height: 64px; margin: 0 auto 10px; position: relative; display: flex; align-items: center; justify-content: center; }
  .brand-orb::before {
    content: ''; position: absolute; inset: -14px; border-radius: 50%;
    background: radial-gradient(circle, var(--sky-glow) 0%, transparent 70%);
    animation: orbPulse 3.5s ease-in-out infinite;
  }
  .brand-orb img { width: 100%; height: 100%; border-radius: 50%; object-fit: contain; z-index: 1; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4)); }
  .brand-title { font-family: 'Cormorant Garamond', serif; font-size: 27px; font-style: italic; color: var(--text-0); }
  .brand-sub { font-family: 'Syne', sans-serif; font-size: 9px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-3); margin-top: 4px; }

  .vista { display: none; animation: revealUp 0.3s cubic-bezier(0.22,1,0.36,1) both; }
  .vista.activa { display: block; }

  .card { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: var(--r-2xl); padding: 22px 20px; backdrop-filter: blur(20px); }
  .saldo-label { font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-3); }
  .saldo-valor { font-family: var(--font-num); font-size: 34px; font-weight: 800; color: var(--text-0); margin-top: 6px; }
  .saldo-valor.negativo { color: #ff9090; }
  .saldo-moneda { font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; color: var(--text-3); margin-top: 2px; }

  .resumen-fila { display: flex; gap: 10px; margin-top: 16px; }
  .resumen-item { flex: 1; border-radius: var(--r-lg); padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
  .resumen-item.ing { background: var(--green-bg); border: 1px solid rgba(44,184,122,0.22); }
  .resumen-item.egr { background: var(--red-bg); border: 1px solid rgba(224,68,68,0.22); }
  .resumen-item-label { font-family: 'Syne', sans-serif; font-size: 9.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
  .resumen-item-valor { font-family: var(--font-num); font-size: 15px; font-weight: 600; }

  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
  .btn-accion { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px 12px; border-radius: var(--r-xl); border: none; cursor: pointer; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; }
  .btn-accion svg { width: 18px !important; height: 18px !important; flex-shrink: 0; }
  .btn-ingreso { background: linear-gradient(135deg, rgba(44,184,122,0.26), rgba(44,184,122,0.12)); border: 1.5px solid rgba(44,184,122,0.35); color: #5de09a; }
  .btn-egreso { background: linear-gradient(135deg, rgba(224,68,68,0.22), rgba(224,68,68,0.10)); border: 1.5px solid rgba(224,68,68,0.32); color: #ff9090; }

  .fila-titulo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .vista-titulo { font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); }
  
  .btn-nuevo, .btn-filtro { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: var(--r-lg); border: none; font-family: 'Syne', sans-serif; font-size: 11.5px; font-weight: 700; cursor: pointer; }
  .btn-nuevo { background: linear-gradient(135deg, var(--sky), var(--sky-bright)); color: #fff; text-transform: uppercase; box-shadow: 0 4px 15px rgba(58,143,209,0.3); }
  .btn-filtro { background: rgba(255,255,255,0.06); border: 1px solid var(--border-hi); color: var(--text-1); }
  .btn-filtro.activo { background: rgba(85,179,245,0.15); border-color: rgba(85,179,245,0.4); color: var(--sky-bright); }

  .lista { display: flex; flex-direction: column; gap: 8px; }
  .item-fila { display: flex; align-items: center; gap: 12px; padding: 14px 15px; border-radius: var(--r-lg); background: rgba(255,255,255,0.04); border: 1px solid var(--border); cursor: pointer; }
  .color-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .mov-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .mov-dot.ing { background: #5de09a; box-shadow: 0 0 10px rgba(93,224,154,0.4); }
  .mov-dot.egr { background: #ff9090; box-shadow: 0 0 10px rgba(255,144,144,0.4); }
  .mov-body { flex: 1; min-width: 0; }
  .mov-concepto { font-size: 14px; font-weight: 600; color: var(--text-0); }
  .mov-meta { font-size: 11.5px; color: var(--text-3); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mov-monto { font-family: var(--font-num); font-size: 15px; font-weight: 700; }
  .mov-monto.ing { color: #5de09a; }
  .mov-monto.egr { color: #ff9090; }

  .segmented { display: flex; background: rgba(255,255,255,0.05); border: 1px solid var(--border-hi); border-radius: var(--r-md); padding: 4px; gap: 4px; margin-bottom: 16px; }
  .segmented button { flex: 1; padding: 10px 8px; border-radius: var(--r-sm); border: none; background: transparent; color: var(--text-3); font-family: 'Syne', sans-serif; font-size: 11.5px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
  .segmented button.activo { background: rgba(85,179,245,0.18); color: var(--sky-bright); border: 1px solid rgba(85,179,245,0.35); }

  .etiquetas-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .etiqueta-tarjeta { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 20px; font-size: 13px; cursor: pointer; }

  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: flex; max-width: 480px; margin: 0 auto; background: rgba(7,16,32,0.85); backdrop-filter: blur(18px); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 12px 0 10px; background: none; border: none; color: var(--text-3); cursor: pointer; position: relative; }
  .nav-item svg { width: 22px; height: 22px; }
  .nav-item span { font-family: 'Syne', sans-serif; font-size: 9px; font-weight: 600; text-transform: uppercase; }
  .nav-item.activo { color: var(--sky-bright); }
  .nav-item.activo::before { content: ''; position: absolute; top: 0; width: 24px; height: 2px; background: var(--sky-bright); border-radius: 2px; }

  .modal-overlay { position: fixed; inset: 0; z-index: 100; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0.65); backdrop-filter: blur(5px); }
  .modal-overlay.activo { display: flex; }
  .modal-sheet { width: 100%; max-width: 480px; max-height: 90vh; background: #0d1e38; border-radius: var(--r-2xl) var(--r-2xl) 0 0; display: flex; flex-direction: column; overflow: hidden; }
  .modal-head { padding: 22px 20px 8px; }
  .modal-titulo { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 700; color: var(--text-0); }
  .modal-body { padding: 14px 20px; overflow-y: auto; flex: 1; }
  .modal-foot { padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); }

  .lf-group { margin-bottom: 14px; }
  .lf-row { display: flex; gap: 10px; }
  .lf-label { display: block; font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--text-3); margin-bottom: 7px; }
  .lf-input, .lf-select, .lf-textarea { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-hi); border-radius: var(--r-md); font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text-0); outline: none; }
  .lf-textarea { resize: vertical; min-height: 60px; }
  .lf-input:focus { border-color: var(--sky-bright); }

  .color-picker { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .color-dot-pick { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .color-dot-pick.selected { border-color: #fff; transform: scale(1.1); }

  .chips-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; background: rgba(85,179,245,0.15); border-radius: 20px; font-size: 12px; color: var(--sky-bright); }
  
  .modal-botones { display: flex; gap: 10px; }
  .btn-main { width: 100%; padding: 16px; border-radius: 16px; background: linear-gradient(135deg, var(--sky), var(--sky-bright)); color: #fff; font-family: 'Syne', sans-serif; font-weight: 800; text-transform: uppercase; border: none; cursor: pointer; }
  .btn-guardar { flex: 1; padding: 14px; border-radius: var(--r-md); border: none; cursor: pointer; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; color: #fff; }
  .btn-guardar.neutro { background: linear-gradient(135deg, var(--sky), #2a6ea8); }
  .btn-cancelar { flex: 1; padding: 14px; border-radius: var(--r-md); border: 1px solid var(--border-hi); background: rgba(255,255,255,0.06); color: var(--text-1); font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
  .btn-eliminar { width: 100%; padding: 14px; border-radius: var(--r-md); border: 1px solid rgba(224,68,68,0.3); background: rgba(224,68,68,0.12); color: #ff9090; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; cursor: pointer; }

  .detalle-row { padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .detalle-label { font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--text-3); }
  .detalle-valor { font-size: 15px; color: var(--text-1); margin-top: 4px; }
  .detalle-archivo-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--sky-bright); text-decoration: none; background: rgba(85,179,245,0.12); border: 1px solid rgba(85,179,245,0.3); border-radius: var(--r-md); padding: 9px 14px; font-weight: 600; font-size: 13px; }

  .vacio { text-align: center; padding: 40px 10px; color: var(--text-3); font-size: 13px; }
  .spinner { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(85,179,245,0.15); border-top-color: var(--sky-bright); animation: spin 0.8s linear infinite; }
</style>
</head>
<body>

<!-- ===== SPLASH SCREEN ===== -->
<div id="splash-screen">
  <div class="brand-orb"><img src="icons/icon-512.png" onerror="this.src='icons/icon-192.png'" alt="Logo"></div>
  <div class="brand-title">Turismo Isabel</div>
  <div class="brand-sub">Ingresos y Egresos</div>
  <div class="spinner" style="margin-top: 30px; width: 20px; height: 20px; border-width: 2px;"></div>
</div>

<!-- ===== PANTALLA LOGIN ===== -->
<div id="login-screen" style="display:none;">
  <div class="brand-orb"><img src="icons/icon-512.png" alt="Logo"></div>
  <div class="brand-title">Turismo Isabel</div>
  <div class="brand-sub">Ingresos y Egresos</div>
  <div class="card" style="width: 100%; margin-top: 32px; max-width: 340px;">
    <div class="lf-group"><label class="lf-label">Email</label><input type="email" id="email" class="lf-input" placeholder="ejemplo@correo.com"></div>
    <div class="lf-group"><label class="lf-label">Contraseña</label><input type="password" id="password" class="lf-input" placeholder="••••••••"></div>
    <button onclick="handleLogin()" class="btn-main">Entrar</button>
    <p id="login-error" style="color:var(--red); font-size:12px; margin-top:15px; display:none;"></p>
  </div>
</div>

<!-- ===== APP PRINCIPAL ===== -->
<div id="app">
  <header class="topbar">
    <div class="brand-orb"><img src="icons/icon-512.png" alt="Logo"></div>
    <div class="brand-title">Turismo Isabel</div>
    <div class="brand-sub">Ingresos y Egresos</div>
  </header>

  <section class="vista activa" id="vista-inicio">
    <div class="card">
      <div class="saldo-label">Saldo actual</div>
      <div class="saldo-valor" id="saldoValor">$ 0</div>
      <div class="resumen-fila">
        <div class="resumen-item ing"><div class="resumen-item-label">Ingresos</div><div class="resumen-item-valor" id="totalIngresos">$ 0</div></div>
        <div class="resumen-item egr"><div class="resumen-item-label">Egresos</div><div class="resumen-item-valor" id="totalEgresos">$ 0</div></div>
      </div>
    </div>
    <div class="acciones">
      <button class="btn-accion btn-ingreso" onclick="abrirModalMovimiento('ingreso')">Ingreso</button>
      <button class="btn-accion btn-egreso" onclick="abrirModalMovimiento('egreso')">Egreso</button>
    </div>
    <div class="fila-titulo"><div class="vista-titulo">Movimientos</div><button class="btn-filtro" id="btnFiltro" onclick="abrirFiltro()">Filtrar</button></div>
    <div id="movLista"></div>
  </section>

  <section class="vista" id="vista-cuentas">
    <div class="fila-titulo"><div class="vista-titulo">Cuentas</div><button class="btn-nuevo" onclick="abrirModalCuenta()">Nueva</button></div>
    <div class="lista" id="cuentasLista"></div>
  </section>

  <section class="vista" id="vista-contrapartes">
    <div class="fila-titulo"><div class="vista-titulo">Contrapartes</div><button class="btn-nuevo" onclick="abrirModalContraparte()">Nueva</button></div>
    <div class="etiquetas-grid" id="contrapartesLista"></div>
  </section>

  <section class="vista" id="vista-categorias">
    <div class="fila-titulo"><div class="vista-titulo">Categorías</div><button class="btn-nuevo" onclick="abrirModalCategoria()">Nueva</button></div>
    <div class="segmented">
      <button id="segEgreso" class="activo" onclick="cambiarSegmentoCategoria('egreso')">Egreso</button>
      <button id="segIngreso" onclick="cambiarSegmentoCategoria('ingreso')">Ingreso</button>
    </div>
    <div class="lista" id="categoriasLista"></div>
  </section>

  <section class="vista" id="vista-etiquetas">
    <div class="fila-titulo"><div class="vista-titulo">Etiquetas</div><button class="btn-nuevo" onclick="abrirModalEtiqueta()">Nueva</button></div>
    <div class="etiquetas-grid" id="etiquetasLista"></div>
  </section>

  <nav class="bottom-nav">
    <button class="nav-item activo" data-vista="inicio" onclick="cambiarVista('inicio')"><span>Inicio</span></button>
    <button class="nav-item" data-vista="cuentas" onclick="cambiarVista('cuentas')"><span>Cuentas</span></button>
    <button class="nav-item" data-vista="contrapartes" onclick="cambiarVista('contrapartes')"><span>Contr.</span></button>
    <button class="nav-item" data-vista="categorias" onclick="cambiarVista('categorias')"><span>Categ.</span></button>
    <button class="nav-item" data-vista="etiquetas" onclick="cambiarVista('etiquetas')"><span>Tags</span></button>
    <button class="nav-item" onclick="logout()"><span>Salir</span></button>
  </nav>
</div>

<!-- MODAL MOVIMIENTO -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet">
    <div class="modal-head"><div class="modal-titulo" id="modalTitulo">Nuevo movimiento</div></div>
    <div class="modal-body">
      <div class="lf-row">
        <div class="lf-group"><label class="lf-label">Fecha *</label><input type="date" class="lf-input" id="inpFecha"></div>
        <div class="lf-group"><label class="lf-label">Hora</label><input type="time" class="lf-input" id="inpHora"></div>
      </div>
      <div class="lf-row">
        <div class="lf-group"><label class="lf-label">Monto *</label><input type="number" step="any" class="lf-input" id="inpMonto" oninput="actualizarPreviewARS()"></div>
        <div class="lf-group" style="max-width:110px;"><label class="lf-label">Moneda</label>
          <select class="lf-select" id="inpMoneda" onchange="onCambioMoneda()">
            <option value="ARS">ARS</option><option value="USD">USD</option><option value="EUR">EUR</option><option value="BRL">BRL</option><option value="OTRA">Otra...</option>
          </select>
        </div>
      </div>
      <div class="lf-group" id="grupoCotizacion" style="display:none;">
        <label class="lf-label">Cotización a ARS</label>
        <input type="number" step="any" class="lf-input" id="inpCotizacion" oninput="actualizarPreviewARS()">
        <div id="previewARS" style="color:var(--sky-bright); font-size:12px; margin-top:6px;"></div>
      </div>
      <div class="lf-group"><label class="lf-label">Concepto</label><input type="text" class="lf-input" id="inpConcepto"></div>
      <div class="lf-group"><label class="lf-label">Cuenta</label><select class="lf-select" id="inpCuenta" onchange="onCambioSelectCuenta()"></select></div>
      <div class="lf-group"><label class="lf-label">Contraparte</label><select class="lf-select" id="inpContraparteId" onchange="onCambioSelectContraparte()"></select></div>
      <div class="lf-group"><label class="lf-label">Categoría</label><select class="lf-select" id="inpCategoria" onchange="onCambioSelectCategoria()"></select></div>
      <div class="lf-group"><label class="lf-label">Etiquetas</label><select class="lf-select" id="inpEtiquetaSelect" onchange="onAddEtiqueta()"></select><div class="chips-wrap" id="chipsEtiquetas"></div></div>
      <div class="lf-group"><label class="lf-label">Notas</label><textarea class="lf-textarea" id="inpNotas"></textarea></div>
      <div class="lf-group"><label class="lf-label">Comprobante</label><input type="file" id="inpArchivo" class="lf-input" accept="image/*,application/pdf"></div>
    </div>
    <div class="modal-foot"><div class="modal-botones"><button class="btn-cancelar" onclick="cerrarModal('modalOverlay')">Cancelar</button><button class="btn-guardar" id="btnGuardar" onclick="guardarMovimiento()">Guardar</button></div></div>
  </div>
</div>

<!-- MODAL FILTROS -->
<div class="modal-overlay" id="filtroOverlay">
  <div class="modal-sheet">
    <div class="modal-head"><div class="modal-titulo">Filtrar Movimientos</div></div>
    <div class="modal-body">
      <div class="lf-group"><label class="lf-label">Desde</label><input type="date" class="lf-input" id="filtroDesde"></div>
      <div class="lf-group"><label class="lf-label">Hasta</label><input type="date" class="lf-input" id="filtroHasta"></div>
      <div class="lf-group"><label class="lf-label">Cuenta</label><select id="filtroCuenta" class="lf-select"></select></div>
      <div class="lf-group"><label class="lf-label">Contraparte</label><select id="filtroContraparte" class="lf-select"></select></div>
      <div class="lf-group"><label class="lf-label">Categoría</label><select id="filtroCategoria" class="lf-select"></select></div>
      <div class="lf-group"><label class="lf-label">Etiqueta</label><select id="filtroEtiqueta" class="lf-select"></select></div>
    </div>
    <div class="modal-foot"><div class="modal-botones"><button class="btn-cancelar" onclick="limpiarFiltros()">Limpiar</button><button class="btn-guardar neutro" onclick="aplicarFiltros()">Aplicar</button></div></div>
  </div>
</div>

<!-- MODALES AUXILIARES -->
<div class="modal-overlay" id="modalCuentaOverlay" style="z-index: 150;"><div class="modal-sheet"><div class="modal-head"><div class="modal-titulo">Cuenta</div></div><div class="modal-body"><div class="lf-group"><label class="lf-label">Nombre *</label><input type="text" id="inpCuentaNombre" class="lf-input"></div><div class="lf-group"><label class="lf-label">Color</label><div class="color-picker" id="colorPickerCuenta"></div></div></div><div class="modal-foot"><button class="btn-guardar neutro" onclick="guardarCuenta()">Guardar</button></div></div></div>
<div class="modal-overlay" id="modalCategoriaOverlay" style="z-index: 150;"><div class="modal-sheet"><div class="modal-head"><div class="modal-titulo">Categoría</div></div><div class="modal-body"><div class="lf-group"><label class="lf-label">Nombre *</label><input type="text" id="inpCategoriaNombre" class="lf-input"></div><div class="segmented"><button id="btnTipoEgresoAux" class="activo" onclick="setTipoCat('egreso')">Egreso</button><button id="btnTipoIngresoAux" onclick="setTipoCat('ingreso')">Ingreso</button></div></div><div class="modal-foot"><button class="btn-guardar neutro" onclick="guardarCategoria()">Guardar</button></div></div></div>
<div class="modal-overlay" id="modalEtiquetaOverlay" style="z-index: 150;"><div class="modal-sheet"><div class="modal-head"><div class="modal-titulo">Etiqueta</div></div><div class="modal-body"><div class="lf-group"><label class="lf-label">Nombre *</label><input type="text" id="inpEtiquetaNombre" class="lf-input"></div><div class="color-picker" id="colorPickerEtiqueta"></div></div><div class="modal-foot"><button class="btn-guardar neutro" onclick="guardarEtiqueta()">Guardar</button></div></div></div>
<div class="modal-overlay" id="modalContraparteOverlay" style="z-index: 150;"><div class="modal-sheet"><div class="modal-head"><div class="modal-titulo">Contraparte</div></div><div class="modal-body"><div class="lf-group"><label class="lf-label">Nombre *</label><input type="text" id="inpContraparteNombre" class="lf-input"></div><div class="color-picker" id="colorPickerContraparte"></div></div><div class="modal-foot"><button class="btn-guardar neutro" onclick="guardarContraparte()">Guardar</button></div></div></div>

<div class="modal-overlay" id="detalleOverlay">
  <div class="modal-sheet">
    <div class="modal-head"><div class="modal-titulo">Detalle</div></div>
    <div class="modal-body" id="detalleBody"></div>
    <div class="modal-foot">
      <div class="modal-botones"><button class="btn-guardar neutro" id="btnEditarMov">Editar</button><button class="btn-eliminar" id="btnEliminarMov">Borrar</button></div>
      <button class="btn-cancelar" style="width:100%; margin-top:10px;" onclick="cerrarModal('detalleOverlay')">Cerrar</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lnbioecdbxkhjwmezwgv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_W9BRolWbAnNqP2giJQMvOQ_LsFV8fmd';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const COLORES = ['#55b3f5', '#2cb87a', '#e04444', '#d9a63e', '#c8a85a', '#9b6fd6', '#e0679a', '#3fc7c0'];
let user = null, cuentas = [], categorias = [], etiquetas = [], movements = [], contrapartes = [];
let vistaActual = 'inicio', tipoActual = 'ingreso', segmentoCategoria = 'egreso';
let colorElegidoCuenta = COLORES[0], colorElegidoEtiqueta = COLORES[0], colorElegidoContraparte = COLORES[0];
let cuentaEditandoId = null, categoriaEditandoId = null, etiquetaEditandoId = null, movEditandoId = null, contraparteEditandoId = null;
let etiquetasSeleccionadas = [], tipoCatForm = 'egreso';
let filtro = { cuenta_id: '', categoria_id: '', etiqueta_id: '', contraparte_id: '', desde: '', hasta: '' };

async function checkUser() {
  const { data: { session } } = await _supabase.auth.getSession();
  setTimeout(() => { document.getElementById('splash-screen').classList.add('hidden'); }, 800);
  if (session) {
    user = session.user; document.getElementById('login-screen').style.display = 'none'; document.getElementById('app').style.display = 'block'; fetchData();
  } else {
    document.getElementById('login-screen').style.display = 'flex'; document.getElementById('app').style.display = 'none';
  }
}

async function handleLogin() {
  const e = document.getElementById('email').value, p = document.getElementById('password').value;
  const { error } = await _supabase.auth.signInWithPassword({ email: e, password: p });
  if (error) { alert(error.message); } else checkUser();
}

async function logout() { await _supabase.auth.signOut(); window.location.reload(); }

async function fetchData() {
  const [rC, rCat, rE, rM, rCon] = await Promise.all([
    _supabase.from('cuentas').select('*').order('nombre'),
    _supabase.from('categorias').select('*').order('nombre'),
    _supabase.from('etiquetas').select('*').order('nombre'),
    _supabase.from('movimientos').select('*, movimiento_etiquetas(etiqueta_id)').order('fecha', { ascending: false }),
    _supabase.from('contrapartes').select('*').order('nombre')
  ]);
  cuentas = rC.data || []; categorias = rCat.data || []; etiquetas = rE.data || []; contrapartes = rCon.data || [];
  movements = (rM.data || []).map(m => ({ ...m, etiquetaIds: m.movimiento_etiquetas.map(x => x.etiqueta_id) }));
  renderTodaLaApp();
}

function fmtARS(n) { return '$ ' + Number(n || 0).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function renderTodaLaApp() { renderInicio(); renderCuentas(); renderCategorias(); renderEtiquetas(); renderContrapartes(); }

function renderInicio() {
  let lista = movements.slice();
  if (filtro.cuenta_id) lista = lista.filter(m => m.cuenta_id === filtro.cuenta_id);
  if (filtro.contraparte_id) lista = lista.filter(m => m.contraparte_id === filtro.contraparte_id);
  if (filtro.categoria_id) lista = lista.filter(m => m.categoria_id === filtro.categoria_id);
  if (filtro.etiqueta_id) lista = lista.filter(m => (m.etiquetaIds || []).includes(filtro.etiqueta_id));
  if (filtro.desde) lista = lista.filter(m => new Date(m.fecha) >= new Date(filtro.desde));
  if (filtro.hasta) lista = lista.filter(m => new Date(m.fecha) <= new Date(filtro.hasta));

  const ing = lista.filter(m => m.tipo === 'ingreso').reduce((a, m) => a + Number(m.monto_ars || m.monto), 0);
  const egr = lista.filter(m => m.tipo === 'egreso').reduce((a, m) => a + Number(m.monto_ars || m.monto), 0);
  document.getElementById('saldoValor').textContent = fmtARS(ing - egr);
  document.getElementById('totalIngresos').textContent = fmtARS(ing);
  document.getElementById('totalEgresos').textContent = fmtARS(egr);

  const cont = document.getElementById('movLista');
  if (!lista.length) { cont.innerHTML = '<div class="vacio">No hay movimientos.</div>'; return; }
  cont.innerHTML = lista.map(m => {
    const esIng = m.tipo === 'ingreso';
    const cCon = contrapartes.find(c => c.id === m.contraparte_id);
    return `<div class="item-fila" onclick="verDetalle('${m.id}')">
      <div class="mov-dot ${esIng?'ing':'egr'}"></div>
      <div class="mov-body">
        <div class="mov-concepto">${escapeHtml(m.concepto || 'Sin concepto')}</div>
        <div class="mov-meta">${new Date(m.fecha).toLocaleDateString()} ${cCon ? ' · '+cCon.nombre : ''}</div>
      </div>
      <div class="mov-right"><div class="mov-monto ${esIng?'ing':'egr'}">${fmtARS(m.monto_ars || m.monto)}</div></div>
    </div>`;
  }).join('');
}

function renderCuentas() {
  document.getElementById('cuentasLista').innerHTML = cuentas.map(c => `<div class="item-fila" onclick="abrirModalCuenta('${c.id}')"><div class="color-dot" style="background:${c.color}"></div>${escapeHtml(c.nombre)}</div>`).join('');
}
function renderCategorias() {
  document.getElementById('categoriasLista').innerHTML = categorias.filter(c => c.tipo === segmentoCategoria || c.tipo === 'ambas').map(c => `<div class="item-fila" onclick="abrirModalCategoria('${c.id}')">${escapeHtml(c.nombre)}</div>`).join('');
}
function renderEtiquetas() {
  document.getElementById('etiquetasLista').innerHTML = etiquetas.map(e => `<div class="etiqueta-tarjeta" onclick="abrirModalEtiqueta('${e.id}')"><div class="color-dot" style="background:${e.color}"></div>${escapeHtml(e.nombre)}</div>`).join('');
}
function renderContrapartes() {
  document.getElementById('contrapartesLista').innerHTML = contrapartes.map(c => `<div class="etiqueta-tarjeta" onclick="abrirModalContraparte('${c.id}')"><div class="color-dot" style="background:${c.color}"></div>${escapeHtml(c.nombre)}</div>`).join('');
}

function cambiarVista(v) {
  document.querySelectorAll('.vista').forEach(x => x.classList.remove('activa'));
  document.getElementById('vista-'+v).classList.add('activa');
  document.querySelectorAll('.nav-item').forEach(x => x.classList.toggle('activo', x.dataset.vista === v));
}

function abrirModalMovimiento(t) {
  tipoActual = t; movEditandoId = null; etiquetasSeleccionadas = [];
  document.getElementById('modalTitulo').textContent = t==='ingreso'?'Nuevo Ingreso':'Nuevo Egreso';
  document.getElementById('inpFecha').valueAsDate = new Date();
  document.getElementById('inpHora').value = new Date().toTimeString().slice(0,5);
  document.getElementById('inpMonto').value = ''; document.getElementById('inpMoneda').value = 'ARS';
  onCambioMoneda(); poblarSelectsMov();
  document.getElementById('chipsEtiquetas').innerHTML = '';
  document.getElementById('modalOverlay').classList.add('activo');
}

function onCambioMoneda() {
  document.getElementById('grupoCotizacion').style.display = document.getElementById('inpMoneda').value === 'ARS' ? 'none' : 'block';
}
function actualizarPreviewARS() {
  const m = parseFloat(document.getElementById('inpMonto').value) || 0;
  const c = parseFloat(document.getElementById('inpCotizacion').value) || 0;
  document.getElementById('previewARS').textContent = c > 0 ? 'Equivale a ' + fmtARS(m * c) : '';
}

function poblarSelectsMov() {
  document.getElementById('inpCuenta').innerHTML = '<option value="">Sin cuenta asignada</option>' + cuentas.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('') + '<option value="NUEVA">+ Nueva Cuenta</option>';
  document.getElementById('inpContraparteId').innerHTML = '<option value="">Sin contraparte</option>' + contrapartes.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('') + '<option value="NUEVA">+ Nueva Contraparte</option>';
  document.getElementById('inpCategoria').innerHTML = '<option value="">Sin categoría asignada</option>' + categorias.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('') + '<option value="NUEVA">+ Nueva Categoría</option>';
  document.getElementById('inpEtiquetaSelect').innerHTML = '<option value="">Sin etiqueta asignada</option>' + etiquetas.map(e => `<option value="${e.id}">${e.nombre}</option>`).join('') + '<option value="NUEVA">+ Nueva Etiqueta</option>';
}

async function guardarMovimiento() {
  const monto = parseFloat(document.getElementById('inpMonto').value);
  if (!monto) return alert("Ingresa un monto");
  const fileInput = document.getElementById('inpArchivo');
  const payload = {
    user_id: user.id, tipo: tipoActual, monto: monto,
    fecha: new Date(document.getElementById('inpFecha').value + 'T' + document.getElementById('inpHora').value).toISOString(),
    concepto: document.getElementById('inpConcepto').value || null,
    cuenta_id: document.getElementById('inpCuenta').value || null,
    contraparte_id: document.getElementById('inpContraparteId').value || null,
    categoria_id: document.getElementById('inpCategoria').value || null,
    moneda: document.getElementById('inpMoneda').value,
    cotizacion: parseFloat(document.getElementById('inpCotizacion').value) || 1,
    notas: document.getElementById('inpNotas').value || null
  };

  const { data, error } = await _supabase.from('movimientos').insert([payload]).select().single();
  if (error) return alert(error.message);

  if (etiquetasSeleccionadas.length) {
    await _supabase.from('movimiento_etiquetas').insert(etiquetasSeleccionadas.map(id => ({ movimiento_id: data.id, etiqueta_id: id })));
  }

  if (fileInput.files[0]) {
    const file = fileInput.files[0], path = `${user.id}/${data.id}/${Date.now()}_${file.name}`;
    await _supabase.storage.from('comprobantes').upload(path, file);
    await _supabase.from('movimientos').update({ archivo_path: path }).eq('id', data.id);
  }
  cerrarModal('modalOverlay'); fetchData();
}

async function verDetalle(id) {
  const m = movements.find(x => x.id === id);
  const con = contrapartes.find(c => c.id === m.contraparte_id);
  let arch = '';
  if (m.archivo_path) {
    const { data } = await _supabase.storage.from('comprobantes').createSignedUrl(m.archivo_path, 300);
    arch = `<a href="${data.signedUrl}" target="_blank" class="detalle-archivo-link">Ver Comprobante</a>`;
  }
  document.getElementById('detalleBody').innerHTML = `
    <div class="detalle-row"><div class="detalle-label">Monto</div><div class="detalle-valor">${fmtARS(m.monto_ars || m.monto)}</div></div>
    <div class="detalle-row"><div class="detalle-label">Concepto</div><div class="detalle-valor">${m.concepto || '-'}</div></div>
    <div class="detalle-row"><div class="detalle-label">Contraparte</div><div class="detalle-valor">${con?con.nombre:'-'}</div></div>
    ${arch}`;
  document.getElementById('btnEliminarMov').onclick = async () => { if(confirm("¿Borrar?")) { await _supabase.from('movimientos').delete().eq('id', id); cerrarModal('detalleOverlay'); fetchData(); } };
  document.getElementById('detalleOverlay').classList.add('activo');
}

function renderColorPick(id, f) {
  document.getElementById(id).innerHTML = COLORES.map(c => `<div class="color-dot-pick" style="background:${c}" onclick="${f}('${c}')"></div>`).join('');
}
function pickC(c) { colorElegidoCuenta = c; }
function pickCon(c) { colorElegidoContraparte = c; }
function pickEt(c) { colorElegidoEtiqueta = c; }

function abrirModalCuenta() { renderColorPick('colorPickerCuenta', 'pickC'); document.getElementById('modalCuentaOverlay').classList.add('activo'); }
async function guardarCuenta() {
  await _supabase.from('cuentas').insert([{ user_id: user.id, nombre: document.getElementById('inpCuentaNombre').value, color: colorElegidoCuenta }]);
  cerrarModal('modalCuentaOverlay'); fetchData();
}
function abrirModalContraparte() { renderColorPick('colorPickerContraparte', 'pickCon'); document.getElementById('modalContraparteOverlay').classList.add('activo'); }
async function guardarContraparte() {
  await _supabase.from('contrapartes').insert([{ user_id: user.id, nombre: document.getElementById('inpContraparteNombre').value, color: colorElegidoContraparte }]);
  cerrarModal('modalContraparteOverlay'); fetchData();
}
function abrirModalCategoria() { document.getElementById('modalCategoriaOverlay').classList.add('activo'); }
async function guardarCategoria() {
  await _supabase.from('categorias').insert([{ user_id: user.id, nombre: document.getElementById('inpCategoriaNombre').value, tipo: tipoCatForm }]);
  cerrarModal('modalCategoriaOverlay'); fetchData();
}
function setTipoCat(t) { tipoCatForm = t; document.getElementById('btnTipoEgresoAux').classList.toggle('activo', t==='egreso'); document.getElementById('btnTipoIngresoAux').classList.toggle('activo', t==='ingreso'); }

function abrirModalEtiqueta() { renderColorPick('colorPickerEtiqueta', 'pickEt'); document.getElementById('modalEtiquetaOverlay').classList.add('activo'); }
async function guardarEtiqueta() {
  await _supabase.from('etiquetas').insert([{ user_id: user.id, nombre: document.getElementById('inpEtiquetaNombre').value, color: colorElegidoEtiqueta }]);
  cerrarModal('modalEtiquetaOverlay'); fetchData();
}

function abrirFiltro() {
  document.getElementById('filtroCuenta').innerHTML = '<option value="">Todas las cuentas</option>' + cuentas.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
  document.getElementById('filtroContraparte').innerHTML = '<option value="">Todas las contrapartes</option>' + contrapartes.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
  document.getElementById('filtroOverlay').classList.add('activo');
}
function aplicarFiltros() {
  filtro.cuenta_id = document.getElementById('filtroCuenta').value;
  filtro.contraparte_id = document.getElementById('filtroContraparte').value;
  filtro.desde = document.getElementById('filtroDesde').value;
  filtro.hasta = document.getElementById('filtroHasta').value;
  cerrarModal('filtroOverlay'); renderInicio();
}
function limpiarFiltros() { filtro = { cuenta_id: '', contraparte_id: '', desde: '', hasta: '' }; renderInicio(); cerrarModal('filtroOverlay'); }
function cerrarModal(id) { document.getElementById(id).classList.remove('activo'); }

function onCambioSelectCuenta() { if(document.getElementById('inpCuenta').value==='NUEVA') abrirModalCuenta(); }
function onCambioSelectContraparte() { if(document.getElementById('inpContraparteId').value==='NUEVA') abrirModalContraparte(); }
function onCambioSelectCategoria() { if(document.getElementById('inpCategoria').value==='NUEVA') abrirModalCategoria(); }
function onAddEtiqueta() { 
  const val = document.getElementById('inpEtiquetaSelect').value;
  if(val==='NUEVA') { abrirModalEtiqueta(); return; }
  if(val && !etiquetasSeleccionadas.includes(val)) {
    etiquetasSeleccionadas.push(val);
    const e = etiquetas.find(x => x.id === val);
    document.getElementById('chipsEtiquetas').innerHTML += `<span class="chip">${e.nombre}</span>`;
  }
}

checkUser();
</script>
</body>
</html>
