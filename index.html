<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Registro — Ingresos y Egresos</title>

<!-- SDK Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --navy:        #071020;
    --sky:         #3a8fd1;
    --sky-bright:  #55b3f5;
    --sky-glow:    rgba(55,170,245,0.16);
    --gold:        #c8a85a;
    --green:       #2cb87a;
    --green-bg:    rgba(44,184,122,0.12);
    --red:         #e04444;
    --red-bg:      rgba(224,68,68,0.12);
    --text-0:      #ffffff;
    --text-1:      rgba(255,255,255,0.85);
    --text-2:      rgba(180,210,240,0.65);
    --text-3:      rgba(140,175,215,0.45);
    --border:      rgba(255,255,255,0.08);
    --border-hi:   rgba(255,255,255,0.14);
    --r-2xl: 28px;
    --font-num: 'Inter', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy);
    color: var(--text-1);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 900px 600px at 60% -10%, #0e2555 0%, transparent 60%),
                radial-gradient(ellipse 600px 500px at 0% 100%, #0a1e44 0%, transparent 55%), var(--navy);
  }

  #app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 22px 16px 110px; display: none; }
  #login-screen { position: relative; z-index: 10; max-width: 400px; margin: 80px auto; padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; }

  header.topbar { text-align: center; margin-bottom: 20px; }
  .brand-orb { width: 64px; height: 64px; margin: 0 auto 10px; position: relative; display: flex; align-items: center; justify-content: center; }
  .brand-orb img { width: 100%; height: 100%; border-radius: 50%; object-fit: contain; z-index: 1; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4)); }
  .brand-title { font-family: 'Cormorant Garamond', serif; font-size: 27px; font-style: italic; color: var(--text-0); }
  .brand-sub { font-family: 'Syne', sans-serif; font-size: 9px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-3); margin-top: 4px; }

  .vista { display: none; }
  .vista.activa { display: block; animation: revealUp 0.3s ease-out; }
  @keyframes revealUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  .card { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: var(--r-2xl); padding: 22px 20px; backdrop-filter: blur(20px); }
  .saldo-valor { font-family: var(--font-num); font-size: 34px; font-weight: 800; color: var(--text-0); margin-top: 6px; }

  .resumen-fila { display: flex; gap: 10px; margin-top: 16px; }
  .resumen-item { flex: 1; border-radius: 16px; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.1); }
  .resumen-item.ing { background: var(--green-bg); color: #5de09a; }
  .resumen-item.egr { background: var(--red-bg); color: #ff9090; }

  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
  .btn-accion { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; border-radius: 20px; border: none; font-family: 'Syne'; font-weight: 700; text-transform: uppercase; cursor: pointer; }
  .btn-ingreso { background: rgba(44,184,122,0.2); color: #5de09a; border: 1px solid rgba(44,184,122,0.3); }
  .btn-egreso { background: rgba(224,68,68,0.2); color: #ff9090; border: 1px solid rgba(224,68,68,0.3); }

  .item-fila { display: flex; align-items: center; gap: 12px; padding: 14px 15px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); cursor: pointer; margin-bottom: 8px; }
  .mov-body { flex: 1; min-width: 0; }
  .mov-concepto { font-size: 14px; font-weight: 600; color: var(--text-0); }
  .mov-meta { font-size: 11.5px; color: var(--text-3); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mov-monto { font-family: var(--font-num); font-size: 15px; font-weight: 700; text-align: right; }

  /* Segmentado colores invertidos */
  .segmented { display: flex; background: rgba(255,255,255,0.05); border: 1px solid var(--border-hi); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 16px; }
  .segmented button { flex: 1; padding: 10px; border-radius: 8px; border: none; background: transparent; color: var(--text-3); font-family: 'Syne'; font-weight: 700; text-transform: uppercase; cursor: pointer; }
  #segEgreso.activo, #btnTipoEgreso.activo { background: rgba(224, 68, 68, 0.25); color: #ff9090; border: 1px solid rgba(224, 68, 68, 0.4); }
  #segIngreso.activo, #btnTipoIngreso.activo { background: rgba(44, 184, 122, 0.25); color: #5de09a; border: 1px solid rgba(44, 184, 122, 0.4); }

  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; max-width: 480px; margin: 0 auto; background: rgba(10,20,38,0.9); backdrop-filter: blur(15px); border-top: 1px solid var(--border); z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 12px 0; background: none; border: none; color: var(--text-3); cursor: pointer; }
  .nav-item svg { width: 22px !important; height: 22px !important; flex-shrink: 0; }
  .nav-item.activo { color: var(--sky-bright); }

  /* Modales y Botones */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: flex-end; justify-content: center; z-index: 200; backdrop-filter: blur(4px); }
  .modal-overlay.activo { display: flex; }
  .modal-sheet { width: 100%; max-width: 480px; background: #0d1e38; border-radius: 24px 24px 0 0; padding: 24px; max-height: 90vh; overflow-y: auto; border-top: 1px solid var(--border-hi); }
  
  .lf-group { margin-bottom: 16px; }
  .lf-label { display: block; font-size: 10px; font-family: 'Syne'; color: var(--text-3); text-transform: uppercase; margin-bottom: 6px; }
  .lf-input, .lf-select, .lf-textarea { width: 100%; padding: 14px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-hi); border-radius: 12px; color: #fff; font-size: 15px; outline: none; }

  .modal-botones { display: flex; gap: 10px; width: 100%; margin-top: 10px; }
  .btn-guardar, .btn-cancelar, .btn-eliminar, .btn-main { 
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 14px; font-family: 'Syne'; font-weight: 700; text-transform: uppercase; cursor: pointer;
  }
  .btn-main { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--sky), var(--sky-bright)); color: #fff; box-shadow: 0 4px 15px rgba(58,143,209,0.3); }
  .btn-guardar { flex: 1; padding: 15px; color: #fff; background: var(--sky); }
  .btn-guardar.ing { background: linear-gradient(135deg, #2cb87a, #1e8a5a); }
  .btn-guardar.egr { background: linear-gradient(135deg, #e04444, #a52d2d); }
  .btn-cancelar { flex: 1; padding: 15px; background: rgba(255,255,255,0.06); color: #fff; border: 1px solid var(--border-hi); }
  .btn-eliminar { flex: 1; padding: 15px; background: rgba(224,68,68,0.15); color: #ff9090; border: 1px solid rgba(224,68,68,0.3); }

  .color-picker { display: flex !important; flex-direction: row !important; flex-wrap: wrap !important; gap: 10px !important; margin-top: 10px; }
  .color-dot-pick { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .color-dot-pick.selected { border-color: #fff; transform: scale(1.1); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="brand-orb">
    <!-- REEMPLAZÁ POR TU LOGO -->
    <img src="TU_LOGO_AQUI.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135673.png'" alt="Logo">
  </div>
  <div class="brand-title">Registro</div>
  <div class="brand-sub">Ingresos y Egresos</div>
  
  <div class="card" style="width: 100%; margin-top: 32px; max-width: 340px;">
    <div class="lf-group"><label class="lf-label" style="text-align:left;">Email</label><input type="email" id="email" class="lf-input"></div>
    <div class="lf-group"><label class="lf-label" style="text-align:left;">Contraseña</label><input type="password" id="password" class="lf-input"></div>
    <button onclick="handleLogin()" class="btn-main">Entrar</button>
    <p id="login-error" style="color:var(--red); font-size:12px; margin-top:15px; display:none;"></p>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand-orb"><img src="TU_LOGO_AQUI.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135673.png'" alt="Logo"></div>
    <div class="brand-title">Registro</div>
  </header>

  <section class="vista activa" id="vista-inicio">
    <div class="card">
      <div class="saldo-valor" id="saldoValor">$ 0</div>
      <div class="resumen-fila">
        <div class="resumen-item ing">Ingresos: <span id="totalIngresos">$ 0</span></div>
        <div class="resumen-item egr">Egresos: <span id="totalEgresos">$ 0</span></div>
      </div>
    </div>

    <div class="acciones">
      <button class="btn-accion btn-ingreso" onclick="abrirModalMovimiento('ingreso')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        Ingreso
      </button>
      <button class="btn-accion btn-egreso" onclick="abrirModalMovimiento('egreso')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
        Egreso
      </button>
    </div>

    <div class="fila-titulo">
      <div class="vista-titulo">Movimientos</div>
      <button class="btn-cancelar" style="width:auto; padding:8px 15px; font-size:11px;" id="btnFiltro" onclick="abrirFiltro()">FILTRAR</button>
    </div>

  </section>

  <!-- PESTAÑA CATEGORIAS -->
  <section class="vista" id="vista-categorias">
    <div class="fila-titulo">
      <div class="vista-titulo">Categorías</div>
      <button class="btn-guardar" style="width:auto; padding:8px 15px;" onclick="abrirModalCategoria()">+ NUEVA</button>
    </div>
    <div class="segmented">
        <button id="segEgreso" class="activo" onclick="cambiarSegmentoCategoria('egreso')">Egreso</button>
        <button id="segIngreso" onclick="cambiarSegmentoCategoria('ingreso')">Ingreso</button>
    </div>
    <div id="categoriasLista"></div>
  </section>

  <!-- PESTAÑAS CUENTAS Y TAGS (Simplificadas para este ejemplo) -->
  <section class="vista" id="vista-cuentas">
    <div class="fila-titulo">
      <div class="vista-titulo">Cuentas</div>
      <button class="btn-guardar" style="width:auto; padding:8px 15px;" onclick="abrirModalCuenta()">+ NUEVA</button>
    </div>
    <div id="cuentasLista"></div>
  </section>

  <section class="vista" id="vista-etiquetas">
    <div class="fila-titulo">
      <div class="vista-titulo">Etiquetas</div>
      <button class="btn-guardar" style="width:auto; padding:8px 15px;" onclick="abrirModalEtiqueta()">+ NUEVA</button>
    </div>
    <div id="etiquetasLista" class="color-picker"></div>
  </section>

  <nav class="bottom-nav">
    <button class="nav-item activo" data-vista="inicio" onclick="cambiarVista('inicio')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V9.5"/></svg><span>Inicio</span></button>
    <button class="nav-item" data-vista="cuentas" onclick="cambiarVista('cuentas')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg><span>Cuentas</span></button>
    <button class="nav-item" data-vista="categorias" onclick="cambiarVista('categorias')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41L12 22l-9-9V4a1 1 0 011-1h9z"/></svg><span>Cat</span></button>
    <button class="nav-item" data-vista="etiquetas" onclick="cambiarVista('etiquetas')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/></svg><span>Tags</span></button>
    <button class="nav-item" onclick="logout()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Salir</span></button>
  </nav>
</div>

<!-- FORMULARIO MOVIMIENTO -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet">
    <div class="modal-head"><div class="modal-titulo" id="modalTitulo">Nuevo Movimiento</div></div>
    <div class="modal-body">
      <div class="lf-row">
        <div class="lf-group"><label class="lf-label">Fecha *</label><input type="date" class="lf-input" id="inpFecha"></div>

      <div class="lf-group"><label class="lf-label">Monto (ARS) *</label><input type="number" class="lf-input" id="inpMonto" placeholder="0.00" style="font-size:20px; font-weight:800;"></div>
      <div class="lf-group"><label class="lf-label">Concepto (Opcional)</label><input type="text" class="lf-input" id="inpConcepto" placeholder="Ej: Pago de servicio"></div>
      <div class="lf-group"><label class="lf-label">Cuenta</label><select class="lf-select" id="inpCuenta" onchange="onCambioSelectCuenta()"></select></div>
      <div class="lf-group"><label class="lf-label">Categoría</label><select class="lf-select" id="inpCategoria" onchange="onCambioSelectCategoria()"></select></div>
      <div class="lf-group"><label class="lf-label">Etiquetas</label><select class="lf-select" id="inpEtiquetaSelect" onchange="onAddEtiqueta()"></select><div id="chipsEtiquetas"></div></div>
    </div>

        <div class="modal-botones">
            <button class="btn-cancelar" onclick="cerrarModal('modalOverlay')">Cerrar</button>
            <button class="btn-guardar" id="btnGuardar" onclick="guardarMovimiento()">Guardar</button>
        </div>
    </div>
  </div>
</div>

<!-- MODALES AUXILIARES -->
<div class="modal-overlay" id="modalCuentaOverlay"><div class="modal-sheet">
    <div class="modal-head"><div class="modal-titulo">Nueva Cuenta</div></div>
    <div class="modal-body">
        <div class="lf-group"><label class="lf-label">Nombre</label><input type="text" id="inpCuentaNombre" class="lf-input"></div>

</div></div>

<div class="modal-overlay" id="modalCategoriaOverlay"><div class="modal-sheet">
    <div class="modal-head"><div class="modal-titulo">Nueva Categoría</div></div>
    <div class="modal-body">
        <div class="lf-group"><label class="lf-label">Nombre</label><input type="text" id="inpCategoriaNombre" class="lf-input"></div>
        <div class="lf-group"><label class="lf-label">Tipo</label><div class="segmented"><button id="btnTipoEgreso" onclick="setTipoCat('egreso')">Egreso</button><button id="btnTipoIngreso" onclick="setTipoCat('ingreso')">Ingreso</button></div></div>

<div class="modal-overlay" id="modalEtiquetaOverlay"><div class="modal-sheet">
    <div class="modal-head"><div class="modal-titulo">Nueva Etiqueta</div></div>
    <div class="modal-body">
        <div class="lf-group"><label class="lf-label">Nombre</label><input type="text" id="inpEtiquetaNombre" class="lf-input"></div>
        <div class="lf-group"><label class="lf-label">Color</label><div class="color-picker" id="colorPickerEtiqueta"></div></div>
    </div>
    <div class="modal-foot"><div class="modal-botones"><button class="btn-cancelar" onclick="cerrarModal('modalEtiquetaOverlay')">Cerrar</button><button class="btn-guardar" onclick="guardarEtiqueta()">Guardar</button></div></div>
</div></div>

<div class="modal-overlay" id="detalleOverlay"><div class="modal-sheet">
    <div class="modal-head"><div class="modal-titulo">Detalle</div></div>
    <div class="modal-body" id="detalleBody"></div>
    <div class="modal-foot">
        <div class="modal-botones">
            <button class="btn-guardar" id="btnEditarMov">Editar</button>
            <button class="btn-eliminar" id="btnEliminarMov">Eliminar</button>
        </div>
        <button class="btn-cancelar" onclick="cerrarModal('detalleOverlay')" style="margin-top:10px; width:100%;">Cerrar</button>
    </div>
</div></div>

<div class="modal-overlay" id="filtroOverlay"><div class="modal-sheet">
    <div class="modal-head"><div class="modal-titulo">Filtros</div></div>
    <div class="modal-body">
        <div class="lf-group"><label class="lf-label">Cuenta</label><select id="filtroCuenta" class="lf-select"></select></div>
        <div class="lf-group"><label class="lf-label">Categoría</label><select id="filtroCategoria" class="lf-select"></select></div>
        <div class="lf-group"><label class="lf-label">Etiqueta</label><select id="filtroEtiqueta" class="lf-select"></select></div>
    </div>
    <div class="modal-foot"><button class="btn-guardar" onclick="aplicarFiltros()">Aplicar</button></div>
</div></div>

<script>
/* === CREDENCIALES === */
const SUPABASE_URL = 'https://lnbioecdbxkhjwmezwgv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_W9BRolWbAnNqP2giJQMvOQ_LsFV8fmd';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const COLORES = ['#55b3f5', '#2cb87a', '#e04444', '#d9a63e', '#c8a85a', '#9b6fd6', '#e0679a', '#3fc7c0'];
let user = null, cuentas = [], categorias = [], etiquetas = [], movements = [];
let vistaActual = 'inicio', tipoActual = 'ingreso', segmentoCategoria = 'egreso';
let colorElegidoCuenta = COLORES[0], colorElegidoCategoria = COLORES[0], colorElegidoEtiqueta = COLORES[0];
let movEditandoId = null, etiquetasSeleccionadas = [], tipoCatForm = 'egreso';
let filtro = { cuenta_id: '', categoria_id: '', etiqueta_id: '' };

/* === AUTH === */
async function checkUser() {
  const { data: { session } } = await _supabase.auth.getSession();
  if (session) {
    user = session.user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    fetchData();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
  }
}
async function handleLogin() {
  const e = document.getElementById('email').value, p = document.getElementById('password').value;
  const { error } = await _supabase.auth.signInWithPassword({ email: e, password: p });
  if (error) { document.getElementById('login-error').innerText = "Datos incorrectos"; document.getElementById('login-error').style.display = 'block'; }
  else checkUser();
}
async function logout() { await _supabase.auth.signOut(); window.location.reload(); }

/* === DATA === */
async function fetchData() {
  const [rC, rCat, rE, rM] = await Promise.all([
    _supabase.from('cuentas').select('*').order('nombre'),
    _supabase.from('categorias').select('*').order('nombre'),
    _supabase.from('etiquetas').select('*').order('nombre'),
    _supabase.from('movimientos').select('*, movimiento_etiquetas(etiqueta_id)').order('fecha', { ascending: false })
  ]);
  cuentas = rC.data || [];
  categorias = rCat.data || [];
  etiquetas = rE.data || [];
  movements = (rM.data || []).map(m => ({ ...m, etiquetaIds: m.movimiento_etiquetas.map(x => x.etiqueta_id) }));
  renderTodaLaApp();
}

/* === RENDERERS === */
function fmtARS(n) { return '$ ' + Number(n || 0).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function renderTodaLaApp() { renderInicio(); renderCuentas(); renderCategorias(); renderEtiquetas(); }

function renderInicio() {
  let lista = movements.slice();
  if (filtro.cuenta_id) lista = lista.filter(m => m.cuenta_id === filtro.cuenta_id);
  if (filtro.categoria_id) lista = lista.filter(m => m.categoria_id === filtro.categoria_id);
  if (filtro.etiqueta_id) lista = lista.filter(m => m.etiquetaIds.includes(filtro.etiqueta_id));

  const ing = lista.filter(m => m.tipo === 'ingreso').reduce((a, m) => a + Number(m.monto_ars || m.monto), 0);
  const egr = lista.filter(m => m.tipo === 'egreso').reduce((a, m) => a + Number(m.monto_ars || m.monto), 0);
  
  document.getElementById('saldoValor').textContent = fmtARS(ing - egr);
  document.getElementById('totalIngresos').textContent = fmtARS(ing);
  document.getElementById('totalEgresos').textContent = fmtARS(egr);

  document.getElementById('movLista').innerHTML = lista.map(m => {
    const esIng = m.tipo === 'ingreso';
    return `
    <div class="item-fila" onclick="verDetalle('${m.id}')">
      <div class="mov-dot ${esIng?'ing':'egr'}">${esIng?'↑':'↓'}</div>
      <div class="mov-body">
        <div class="mov-concepto">${m.concepto ? escapeHtml(m.concepto) : '<i>Sin concepto</i>'}</div>
        <div class="mov-meta">${new Date(m.fecha).toLocaleString('es-AR', {hour12: false})}</div>
      </div>
      <div class="mov-right"><div class="mov-monto ${esIng?'ing':'egr'}">${fmtARS(m.monto)}</div></div>
    </div>`;
  }).join('');
}

function renderCuentas() {
  document.getElementById('cuentasLista').innerHTML = cuentas.map(c => `<div class="item-fila" onclick="abrirModalCuenta('${c.id}')"><div class="color-dot" style="background:${c.color}"></div>${escapeHtml(c.nombre)}</div>`).join('');
}

function renderCategorias() {
  const filtered = categorias.filter(c => c.tipo === segmentoCategoria || c.tipo === 'ambas');
  document.getElementById('categoriasLista').innerHTML = filtered.map(c => `<div class="item-fila" onclick="abrirModalCategoria('${c.id}')"><div class="color-dot" style="background:${c.color}"></div>${escapeHtml(c.nombre)}</div>`).join('');
}

function renderEtiquetas() {
  document.getElementById('etiquetasLista').innerHTML = etiquetas.map(e => `<div class="etiqueta-tarjeta" onclick="abrirModalEtiqueta('${e.id}')"><div class="color-dot" style="background:${e.color}"></div>${escapeHtml(e.nombre)}</div>`).join('');
}

/* === MODAL & UI HELPERS === */
function cambiarVista(v) {
  document.querySelectorAll('.vista').forEach(x => x.classList.remove('activa'));
  document.getElementById('vista-'+v).classList.add('activa');
  document.querySelectorAll('.nav-item').forEach(x => x.classList.toggle('activo', x.dataset.vista === v));
}

function cerrarModal(id) { document.getElementById(id).classList.remove('activo'); }

// Cerrar al tocar afuera
document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => { if (e.target === overlay) cerrarModal(overlay.id); });
});

function abrirModalMovimiento(t) {
  tipoActual = t; movEditandoId = null; etiquetasSeleccionadas = [];
  document.getElementById('modalTitulo').textContent = t === 'ingreso'?'Nuevo Ingreso':'Nuevo Egreso';
  document.getElementById('inpFecha').valueAsDate = new Date();
  document.getElementById('inpHora').value = new Date().toTimeString().slice(0,5);
  document.getElementById('inpMonto').value = ''; document.getElementById('inpConcepto').value = '';
  document.getElementById('btnGuardar').className = "btn-guardar " + (t === 'ingreso' ? 'ing' : 'egr');
  poblarSelectsMov();
  document.getElementById('modalOverlay').classList.add('activo');
}

function poblarSelectsMov(selCta, selCat) {
  document.getElementById('inpCuenta').innerHTML = '<option value="">Sin cuenta</option>' + cuentas.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('') + '<option value="NUEVA">+ NUEVA CUENTA</option>';
  document.getElementById('inpCategoria').innerHTML = '<option value="">Sin categoría</option>' + categorias.filter(c=>c.tipo===tipoActual||c.tipo==='ambas').map(c => `<option value="${c.id}">${c.nombre}</option>`).join('') + '<option value="NUEVA">+ NUEVA CATEGORÍA</option>';
  document.getElementById('inpEtiquetaSelect').innerHTML = '<option value="">Agregar Etiqueta</option>' + etiquetas.map(e => `<option value="${e.id}">${e.nombre}</option>`).join('') + '<option value="NUEVA">+ NUEVA ETIQUETA</option>';
}

function onAddEtiqueta() {
    const s = document.getElementById('inpEtiquetaSelect');
    if (s.value === 'NUEVA') { abrirModalEtiqueta(null, true); s.value = ''; return; }
    if (s.value && !etiquetasSeleccionadas.includes(s.value)) {
        etiquetasSeleccionadas.push(s.value);
        const tag = etiquetas.find(x => x.id === s.value);
        document.getElementById('chipsEtiquetas').innerHTML += `<span class="chip">${tag.nombre}</span>`;
    }
    s.value = '';
}

/* === CRUD SUPABASE === */
async function guardarMovimiento() {
  const monto = parseFloat(document.getElementById('inpMonto').value);
  const fecha = document.getElementById('inpFecha').value, hora = document.getElementById('inpHora').value;
  if (!monto || !fecha) return alert("Monto y Fecha son obligatorios");

  const payload = {
    user_id: user.id, tipo: tipoActual, monto, moneda: 'ARS', cotizacion: 1,
    concepto: document.getElementById('inpConcepto').value || null,
    cuenta_id: document.getElementById('inpCuenta').value || null,
    categoria_id: document.getElementById('inpCategoria').value || null,
    fecha: new Date(`${fecha}T${hora}`).toISOString()
  };

  let res;
  if (movEditandoId) {
      await _supabase.from('movimientos').update(payload).eq('id', movEditandoId);
      await _supabase.from('movimiento_etiquetas').delete().eq('movimiento_id', movEditandoId);
      res = { data: { id: movEditandoId } };
  } else {
      const { data } = await _supabase.from('movimientos').insert([payload]).select().single();
      res = { data };
  }

  if (etiquetasSeleccionadas.length) {
    await _supabase.from('movimiento_etiquetas').insert(etiquetasSeleccionadas.map(id => ({ movimiento_id: res.data.id, etiqueta_id: id })));
  }

  cerrarModal('modalOverlay'); fetchData();
}

async function verDetalle(id) {
  const m = movements.find(x => x.id === id);
  document.getElementById('detalleBody').innerHTML = `
    <div class="detalle-row"><div class="detalle-label">Monto</div><div class="detalle-valor" style="font-weight:700; color:${m.tipo==='ingreso'?'#5de09a':'#ff9090'}">${fmtARS(m.monto)}</div></div>
    <div class="detalle-row"><div class="detalle-label">Concepto</div><div class="detalle-valor">${escapeHtml(m.concepto) || 'Sin concepto'}</div></div>
    <div class="detalle-row"><div class="detalle-label">Fecha</div><div class="detalle-valor">${new Date(m.fecha).toLocaleString('es-AR', {hour12: false})}</div></div>`;
  
  document.getElementById('btnEliminarMov').onclick = async () => { if(confirm("¿Eliminar?")) { await _supabase.from('movimientos').delete().eq('id', id); cerrarModal('detalleOverlay'); fetchData(); } };
  document.getElementById('btnEditarMov').onclick = () => { cerrarModal('detalleOverlay'); editarMovimiento(m); };
  document.getElementById('detalleOverlay').classList.add('activo');
}

function editarMovimiento(m) {
    movEditandoId = m.id; tipoActual = m.tipo;
    abrirModalMovimiento(m.tipo);
    document.getElementById('inpMonto').value = m.monto;
    document.getElementById('inpConcepto').value = m.concepto || '';
    document.getElementById('inpFecha').value = m.fecha.split('T')[0];
    document.getElementById('inpHora').value = new Date(m.fecha).toTimeString().slice(0,5);
    document.getElementById('inpCuenta').value = m.cuenta_id || '';
    document.getElementById('inpCategoria').value = m.categoria_id || '';
}

/* === AUXILIAR CRUD (CUENTA, CAT, TAG) === */
function renderColorPick(id, sel, f) {
  document.getElementById(id).innerHTML = COLORES.map(c => `<div class="color-dot-pick ${c===sel?'selected':''}" style="background:${c}" onclick="${f}('${c}')"></div>`).join('');
}
function pickC(c) { colorElegidoCuenta = c; renderColorPick('colorPickerCuenta', c, 'pickC'); }
function pickCat(c) { colorElegidoCategoria = c; renderColorPick('colorPickerCategoria', c, 'pickCat'); }
function pickEt(c) { colorElegidoEtiqueta = c; renderColorPick('colorPickerEtiqueta', c, 'pickEt'); }

function abrirModalCuenta(id, r) { modoRapido = r; pickC(COLORES[0]); document.getElementById('modalCuentaOverlay').classList.add('activo'); }
async function guardarCuenta() {
    const n = document.getElementById('inpCuentaNombre').value;
    const { data } = await _supabase.from('cuentas').insert([{ user_id: user.id, nombre: n, color: colorElegidoCuenta }]).select();
    cerrarModal('modalCuentaOverlay'); await fetchData();
    if(modoRapido) poblarSelectsMov(data[0].id);
}

function setTipoCat(t) { tipoCatForm = t; document.getElementById('btnTipoEgreso').className = t==='egreso'?'activo':''; document.getElementById('btnTipoIngreso').className = t==='ingreso'?'activo':''; }
function abrirModalCategoria(id, r) { modoRapido = r; setTipoCat('egreso'); pickCat(COLORES[0]); document.getElementById('modalCategoriaOverlay').classList.add('activo'); }
async function guardarCategoria() {
    const n = document.getElementById('inpCategoriaNombre').value;
    const { data } = await _supabase.from('categorias').insert([{ user_id: user.id, nombre: n, tipo: tipoCatForm, color: colorElegidoCategoria }]).select();
    cerrarModal('modalCategoriaOverlay'); await fetchData();
    if(modoRapido) poblarSelectsMov(undefined, data[0].id);
}

function abrirModalEtiqueta(id, r) { modoRapido = r; pickEt(COLORES[0]); document.getElementById('modalEtiquetaOverlay').classList.add('activo'); }
async function guardarEtiqueta() {
    const n = document.getElementById('inpEtiquetaNombre').value;
    const { data } = await _supabase.from('etiquetas').insert([{ user_id: user.id, nombre: n, color: colorElegidoEtiqueta }]).select();
    cerrarModal('modalEtiquetaOverlay'); await fetchData();
    if(modoRapido) { etiquetasSeleccionadas.push(data[0].id); document.getElementById('chipsEtiquetas').innerHTML += `<span class="chip">${data[0].nombre}</span>`; }
}

/* === FILTROS === */
function abrirFiltro() {
    document.getElementById('filtroCuenta').innerHTML = '<option value="">Todas</option>' + cuentas.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('');
    document.getElementById('filtroCategoria').innerHTML = '<option value="">Todas</option>' + categorias.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('');
    document.getElementById('filtroEtiqueta').innerHTML = '<option value="">Todas</option>' + etiquetas.map(e=>`<option value="${e.id}">${e.nombre}</option>`).join('');
    document.getElementById('filtroOverlay').classList.add('activo');
}
function aplicarFiltros() {
    filtro.cuenta_id = document.getElementById('filtroCuenta').value;
    filtro.categoria_id = document.getElementById('filtroCategoria').value;
    filtro.etiqueta_id = document.getElementById('filtroEtiqueta').value;
    cerrarModal('filtroOverlay'); renderInicio();
}
function limpiarFiltros() { filtro = {cuenta_id:'', categoria_id:'', etiqueta_id:''}; cerrarModal('filtroOverlay'); renderInicio(); }

function cambiarSegmentoCategoria(s) { segmentoCategoria = s; document.getElementById('segEgreso').className = s==='egreso'?'activo':''; document.getElementById('segIngreso').className = s==='ingreso'?'activo':''; renderCategorias(); }
function onCambioSelectCuenta() { if (document.getElementById('inpCuenta').value==='NUEVA') abrirModalCuenta(null, true); }
function onCambioSelectCategoria() { if (document.getElementById('inpCategoria').value==='NUEVA') abrirModalCategoria(null, true); }

checkUser();
</script>
